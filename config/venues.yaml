    location: {address: "4 W 58th St, New York, NY 10019", geo: [40.76376, -73.9743]}
    # 常规场次只在售票站 tickets.paristheaternyc.com，被 Cloudflare 拦截（不绕过）；改用 screenslate，再加上官网首页里的特别活动（SOURCES.md §16）
    source: {adapter: custom, module: paris, nid: 43542}
    fallback: null
    horizon_days: 30
    rate_limit_s: 1

  - id: filmadelphia
    name: Philadelphia Film Society
    short: PFS
    region: PHL
    timezone: America/New_York
    color: "#8d99ae"
    website: https://filmadelphia.org/
    location:                  # 三家影院；影厅名以 PFC / Bourse / East 区分
      address: "1412 Chestnut St, Philadelphia, PA 19102"
      geo: [39.95082, -75.16469]
      places:
        - {match: PFC, name: Philadelphia Film Center, address: "1412 Chestnut St, Philadelphia, PA 19102", geo: [39.95082, -75.16469]}
        - {match: Bourse, name: PFS Bourse Theater, address: "400 Ranstead St, Philadelphia, PA 19106", geo: [39.94933, -75.14765]}
        - {match: East, name: PFS East Theater, address: "125 S 2nd St, Philadelphia, PA 19106", geo: [39.9475, -75.14346]}
    # 网站被 WAF 挡住，改用售票系统 Agile Ticketing 的公开 feed（SOURCES.md §9）；screenslate 不收录费城
    source: {adapter: custom, module: filmadelphia}
    fallback: null
    horizon_days: 60
    rate_limit_s: 3
    agile_guid: 6634566a-a49f-4dec-89e6-bb4c5eda4814
    # 电影节（PFF35）走另一个售票入口、不在这个 feed 里：场刊 PDF 导入的 config/schedules/pff35.yaml 补上，
    # feed 里同一栋楼、10 分钟内、同一部片已有的不用（SOURCES.md §9）
    schedules: [config/schedules/pff35.yaml]

