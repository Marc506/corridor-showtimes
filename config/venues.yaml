# 影院注册表（v2 格式，字段见 ARCHITECTURE.md §4）。
# 加一家影院最简单的办法：python -m scraper.add "影院名" <排片页网址>
# 手写时：source.adapter 选一个平台适配器（filmbot、veezi、agile、tribe …）只填参数；
#         服务端 HTML 用 adapter: recipe；只有这两种都不行才写 scraper/sources/<module>.py（adapter: custom）。
# 旧的 v1 列表格式（scraper: / city: / screenslate_nid:）仍然可以加载。
version: 2
venues:
  - id: bam
    name: BAM Rose Cinemas
    short: BAM
    region: NYC
    timezone: America/New_York
    color: "#3a86ff"
    website: https://www.bam.org/film
    location: {address: "30 Lafayette Ave, Brooklyn, NY 11217", geo: [40.6867, -73.97751]}
    source: {adapter: custom, module: bam}
    fallback: {adapter: screenslate, nid: 244}
    horizon_days: 60
    rate_limit_s: 1

  - id: filmlinc
    name: Film at Lincoln Center
    short: FLC
    region: NYC
    timezone: America/New_York
    color: "#c1121f"
    website: https://www.filmlinc.org/
    location:                  # 大部分场次在 Elinor Bunin Munroe Film Center；按影厅名对应到其他楼（含纽约电影节外区场地）
      address: "144 W 65th St, New York, NY 10023"
      geo: [40.77345, -73.98357]
      places:
        - {match: Walter Reade, name: Walter Reade Theater, address: "165 W 65th St, New York, NY 10023", geo: [40.77409, -73.98431]}
        - {match: Alice Tully, name: Alice Tully Hall, address: "1941 Broadway, New York, NY 10023", geo: [40.7735, -73.98258]}
        - {match: MOMI, name: Museum of the Moving Image, address: "36-01 35th Ave, Astoria, NY 11106", geo: [40.75619, -73.92401]}
        - {match: BAM, name: BAM Rose Cinemas, address: "30 Lafayette Ave, Brooklyn, NY 11217", geo: [40.6867, -73.97751]}
        - {match: AMC Bay Plaza, name: AMC Bay Plaza Cinema 13, address: "2210 Bartow Ave, Bronx, NY 10475", geo: [40.86704, -73.82517]}
        - {match: Alamo Staten Island, name: Alamo Drafthouse Staten Island, address: "2636 Hylan Blvd, Staten Island, NY 10306", geo: [40.56625, -74.10941]}
    source: {adapter: custom, module: filmlinc}
    fallback: {adapter: screenslate, nid: 355}
    horizon_days: 60
    rate_limit_s: 1

  - id: japansociety
    name: Japan Society
    short: JS
    region: NYC
    timezone: America/New_York
    color: "#e9b949"
    website: https://japansociety.org/film/
    location: {address: "333 E 47th St, New York, NY 10017", geo: [40.75256, -73.96825]}
    source: {adapter: custom, module: japansociety}
    fallback: {adapter: screenslate, nid: 339}
    horizon_days: 90
    rate_limit_s: 1
    allow_empty: true          # 电影少，可能真的为 0
    default_language: Japanese # 网站不写语言；TMDB 查不到时按日语算

  - id: anthology
