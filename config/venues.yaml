  - id: reel-nomadic
    name: Reel Nomadic
    short: RN
    region: PHL
    timezone: America/New_York
    color: '#8338ec'
    website: https://ma.to/venue/reel_nomadic
    # 流动放映团体（户外 / 酒廊），没有自己的网站排片页；读活动聚合站 ma.to 上它的页面（JSON-LD）。
    # 一晚通常两部片，片名在介绍里用引号写出；时间是入场时间，备注写入场和开映（「天黑后」），不估结束时间（SOURCES.md §17）
    # 没有固定场地：默认是最常用的 Penn Treaty Park；别的场地出现时按场地名（screen）加到 places 里
    location: {name: Penn Treaty Park, address: "1301 N Beach St, Philadelphia, PA 19125", geo: [39.9655, -75.1293]}
    source:
      adapter: jsonld
      pages: ['https://ma.to/venue/reel_nomadic']
      titles_from_description: true
      screen_from_location: true
      event_notes: true
    fallback: null
    horizon_days: 45
    rate_limit_s: 2

  - id: secret-cinema
    name: The Secret Cinema
    short: Secret
    region: PHL
    timezone: America/New_York
    color: '#fb5607'
    website: https://www.thesecretcinema.com/
    # 1992 年起的流动 16mm 放映（Rotunda、富兰克林研究所、酒吧、画廊……）；首页手写 HTML（UTF-16），
    # 每场一节，写了日期和时间的才算；「FUTURE … (more info soon)」只有日期，不收（SOURCES.md §18）
    location:
      address: "4014 Walnut St, Philadelphia, PA 19104"
      geo: [39.9544, -75.2028]
      places:
        - {match: Rotunda, name: The Rotunda, address: "4014 Walnut St, Philadelphia, PA 19104", geo: [39.9544, -75.2028]}
        - {match: Franklin Institute, name: The Franklin Institute, address: "222 N 20th St, Philadelphia, PA 19103", geo: [39.9582, -75.1731]}
    source: {adapter: custom, module: secret_cinema}
    fallback: null
    horizon_days: 90
    rate_limit_s: 2

