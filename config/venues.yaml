  # ---- Reference only: scraped and stored, never shown on the page. A commercial chain's schedule tells which new
  # films are in wide release, for the "Limited screenings" filter (scraper/export.py, regular_runs). One request
  # per city covers every Alamo there.
  - id: ref-alamo-nyc
    name: Alamo Drafthouse NYC (reference)
    region: NYC
