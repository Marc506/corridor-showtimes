 held its World Premiere at this year’s Venice Film Festival and won the Silver Lion Grand Jury Prize, follows the intertwined relationship of two married couples facing different paths and hidden desires.\u0026nbsp;\u003cbr\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eTo celebrate the release of Director Lee’s latest triumph, The Paris Theater is proud to announce\u0026nbsp;\u003cstrong\u003eFreedom and Desire: The Films of Lee Chang-dong\u003c/strong\u003e, the first retrospective of Director Lee’s in New York City to feature all eight of his films as director, including the U.S. premiere of the 2022 short film,\u0026nbsp;\u003ci\u003e\u003cstrong\u003eHeartbeat\u003c/strong\u003e\u003c/i\u003e\u003cstrong\u003e.\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eWhen discussing his latest film, Director Lee notes how\u0026nbsp;\u003ci\u003ePossible Love\u003c/i\u003e reflects his belief that no matter the pain, struggle, frustration and despair we face in life, what allows us to overcome these obstacles is our desire for freedom. This powerful notion echoes throughout his filmography, with characters constantly pursuing more than what their circumstances in life have given them –\u0026nbsp; from his first feature\u0026nbsp;\u003ci\u003e\u003cstrong\u003eGreen Fish\u003c/strong\u003e\u003c/i\u003e (1997) through his collection of award-winning masterpieces – including\u0026nbsp;\u003ci\u003e\u003cstrong\u003eOasis\u003c/strong\u003e\u003c/i\u003e (2002, Best Director at Venice FIlm Festival),\u0026nbsp;\u003ci\u003e\u003cstrong\u003eSecret Sunshine\u003c/strong\u003e\u003c/i\u003e (2007, Best Actress at Cannes Film Festival),\u0026nbsp;\u003ci\u003e\u003cstrong\u003ePoetry\u0026nbsp;\u003c/strong\u003e\u003c/i\u003e(2010, Best Screenplay at Cannes Film Festival), and\u0026nbsp;\u003ci\u003e\u003cstrong\u003eBurning\u003c/strong\u003e\u003c/i\u003e (2018, Cannes FIPRESCI Prize). Don’t miss the chance to experience all of these journeys at the Paris!\u0026nbsp;\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eThe series kicks off on Saturday, September 26 with 1999’s\u0026nbsp;\u003ci\u003e\u003cstrong\u003ePeppermint Candy\u003c/strong\u003e\u003c/i\u003e, followed by a Q\u0026amp;A with\u0026nbsp;\u003cstrong\u003eLee Chang-dong\u003c/strong\u003e and his longtime collaborator, actor\u0026nbsp;\u003cstrong\u003eSul Kyung-gu\u003c/strong\u003e (who also stars in\u0026nbsp;\u003ci\u003ePossible Love\u003c/i\u003e).\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eWe’ll close the series on November 24 with\u0026nbsp;\u003ci\u003e\u003cstrong\u003ePossible Love\u0026nbsp;\u003c/strong\u003e\u003c/i\u003e\u003cstrong\u003eon 35mm\u003c/strong\u003e, preceded by the U.S. premiere of Director Lee’s 2022 short film\u0026nbsp;\u003ci\u003e\u003cstrong\u003eHeartbeat\u003c/strong\u003e\u003c/i\u003e\u003cstrong\u003e.\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003ci\u003e\u003cstrong\u003ePossible Love\u003c/strong\u003e\u003c/i\u003e\u003cstrong\u003e opens in select theaters on October 23, including Film at Lincoln Center and Angelika Film Center in New York City. It streams only on Netflix starting November 6.\u003c/strong\u003e\u003c/p\u003e"])</script><script>self.__next_f.push([1,"17:T596,Murder, blackmail, theft, extortion — just another summer in Hollywood. It’s 1977, eight years since Cliff Booth (Brad Pitt) encountered the Manson family in Quentin Tarantino’s parallel history of 1969, ONCE UPON A TIME...IN HOLLYWOOD. In THE FURTHER MIS-ADVENTURES OF CLIFF BOOTH, directed by David Fincher from a new script by Tarantino, the fairytale is over. Los Angeles no longer needs a hippie-slaying stuntman the way it did. But Hollywood will always have problems, problems that can only be solved by someone with Cliff’s unique (occasionally extralegal) abilities. When he’s not earning his keep bartending or as a projectionist,  engagement.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eA bold tapestry spanning nearly a century of Spanish history,\u0026nbsp;\u003ci\u003eLa Bola Negra\u0026nbsp;\u003c/i\u003efollows three generations of men across pivotal moments in Spanish history: 1932, 1937, and 2017. Carlos (Milo Quifes) longs to belong in a fractured Spain. Sebastián (Guitarricadelafuente) finds connection across enemy lines. And Alberto (Carlos González) uncovers a long-buried family secret — one that finally gives voice to truths the past tried to erase. Academy Award winner\u0026nbsp;Penelope Cruz and three-time Golden Globe winner\u0026nbsp;Glenn Close make special appearances.\u0026nbsp;\u003cbr\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eTo celebrate the arrival of Calvo and Ambrossi’s eagerly anticipated film, The Paris Theater is proud to present\u0026nbsp;\u003cstrong\u003eQueer, Period.\u003c/strong\u003e, a repertory film series curated in collaboration with Ambrossi and Calvo, and inspired by\u0026nbsp;\u003ci\u003eLa Bola Negra\u003c/i\u003e’s story of freedom, legacy, and LGBTQ+ visibility.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eThe films in\u003ci\u003e\u003cstrong\u003e \u003c/strong\u003e\u003c/i\u003e\u003cstrong\u003eQueer, Period.\u003c/strong\u003e use the form of the traditional period piece to re-examine history through a queer lens, centering bold, radical and romantic works from some of international cinema’s most heralded auteurs:\u0026nbsp; experience Sally Potter’s adaptation of Virginia Woolf’s\u0026nbsp;\u003ci\u003eOrlando\u003c/i\u003e, Rainer Werner Fassbinder’s final and perhaps most provocative film\u0026nbsp;\u003ci\u003eQuerelle\u003c/i\u003e, Derek Jarman’s erotically-charged debut feature\u0026nbsp;\u003ci\u003eSebastiane\u003c/i\u003e, James Ivory’s interpretation of E.M. Forster’s romance\u0026nbsp;\u003ci\u003eMaurice\u003c/i\u003e, and electrifying Sapphic romances in locales like the English royal court (\u003ci\u003eThe Favourite\u003c/i\u003e), Japanese-ruled Korea (\u003ci\u003eThe Handmaiden\u003c/i\u003e), 18th-century France (\u003ci\u003ePortrait of a Lady on Fire\u003c/i\u003e) and 1950s New York (\u003ci\u003eCarol\u003c/i\u003e).\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003ci\u003e\u003cstrong\u003eLa Bola Negra\u003c/strong\u003e\u003c/i\u003e arrives in select theaters on October 16, including a 35mm run at the Paris Theater.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"1a:Ta7a,"])</script><script>self.__next_f.push([1,"\u003cp\u003e\u003ci\u003e\u003cstrong\u003ePossible Love\u003c/strong\u003e\u003c/i\u003e, the first feature film in eight years from internationally acclaimed auteur\u0026nbsp;\u003cstrong\u003eLee Chang-dong\u003c/strong\u003e, will release in select theaters on October 23, and stream only on Netflix starting November 6. The film, which held its World Premiere at this year’s Venice Film Festival and won the Silver Lion Grand Jury Prize, follows the intertwined relationship of two married couples facing different paths and hidden desires.\u0026nbsp;\u003cbr\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eTo celebrate the release of Director Lee’s latest triumph, The Paris Theater is proud to announce\u0026nbsp;\u003cstrong\u003eFreedom and Desire: The Films of Lee Chang-dong\u003c/strong\u003e, the first retrospective of Director Lee’s in New York City to feature all eight of his films as director, including the U.S. premiere of the 2022 short film,\u0026nbsp;\u003ci\u003e\u003cstrong\u003eHeartbeat\u003c/strong\u003e\u003c/i\u003e\u003cstrong\u003e.\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eWhen discussing his latest film, Director Lee notes how\u0026nbsp;\u003ci\u003ePossible Love\u003c/i\u003e reflects his belief that no matter the pain, struggle, frustration and despair we face in life, what allows us to overcome these obstacles is our desire for f ng\u003e\u003c/i\u003e\u003cstrong\u003e opens in select theaters on October 23, including Film at Lincoln Center and Angelika Film Center in New York City. It streams only on Netflix starting November 6.\u003c/strong\u003e\u003c/p\u003e"])</script><script>self.__next_f.push([1,"1b:T408,\u003cp\u003e\u003ci\u003e\u003cstrong\u003eQ\u0026amp;A with director Lee Chang-dong and actor Sul Kyung-gu\u003c/strong\u003e\u003c/i\u003e\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003ci\u003e\u003cstrong\u003e4K Restoration! \u003c/strong\u003e\u003c/i\u003eYongho (Sul Kyung-gu) stares down an oncoming train as twenty years of his life flash before his eyes. Proceeding to move backward in time, Lee Chang-dong's acclaimed second directorial feature rewinds the protagonist's loss of humanity - from his fraught, self-hating middle age through his callow teens. The moments in between these events, as seen through the lens of Yongho’s oppressive struggles, mirror South Korea’s traumatic political history during the late 20th century.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eAn official selection of the Directors' Fortnight selection in Cannes and winner of the Special Prize of the Jury at the Karlovy Vary International Film Festival, \u003ci\u003e\u003cstrong\u003ePeppermint Candy\u003c/strong\u003e\u003c/i\u003e is a powerful work of Korean New Wave cinema that elegizes a generation of marginalized people with “quiet, heartbreaking power” (\u003ci\u003eThe New York Times\u003c/i\u003e).\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e1c:T4b8,\u003cp\u003e\u003ci\u003eSouth Korea's official selection for International Feature Film at the 99th Academy Awards®\u003c/i\u003e\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003ci\u003eWinner - Silver Lion, Grand Jury Prize, Venice Film Festival\u003c/i\u003e\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003ci\u003e\u003cstrong\u003e35mm print! \u003c/strong\u003e\u003c/i\u003eA story of two married couples — a laid-off worker and his spouse and a documentary filmmaker and her spouse — crossing paths to film a documentary and facing their different lives and hidden desires.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003ci\u003ePreceded by the US Premiere of\u003c/i\u003e\u003cbr\u003e\u003cbr\u003e\u003ci\u003e\u003cstrong\u003eHeartbeat \u003c/strong\u003e\u003c/i\u003e(2022, DCP, 28 min., produced by Qiao Cui)\u003cbr\u003eCaught up in anxiety, eight-year-old Chul in school tells his teacher that he is going to the bathroom, but runs straight home.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eWe are pleased to invite \u003c/strong\u003e\u003ci\u003e\u003cstrong\u003eAMPAS, SAG NOM COMM, BAFTA, PGA, DGA, WGA, ACE, ADG, ASC, CAS, CDG, CSA, MPEG, MPSE, SCL, VES\u003c/strong\u003e\u003c/i\u003e\u003cstrong\u003e Guild Members: Members and a guest are allowed complimentary entry to any publ"])</script><script>self.__next_f.push([1,"ic screening of new release titles on a space-available basis, upon presentation of your membership card at the venue box office 30 minutes prior to showtime (advance reservations not available).\u003c/strong\u003e\u003c/p\u003e1d:Tbb6,"])</script><script>self.__next_f.push([1,"\u003cp\u003eOn October 1, Netflix will release Zoe Kazan’s adaptation of John Steinbeck’s masterpiece \u003ci\u003e\u003cstrong\u003eEast of Eden\u003c/strong\u003e\u003c/i\u003e. The seven-episode series features a formidable cast led by Florence Pugh as the indelible antihero Cathy Ames, whose life is intertwined with the lives of generations of men from the Trask family (including Christopher Abbott as Adam and Mike Faist as Charles) as the characters live out the darker side of the California dream. The series arrives over 70 years after the 1955 film adaptation starring James Dean - directed by Elia Kazan, Zoe’s grandfather - focused solely on the book’s final section.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eThat family connection to the material, as well as her own abiding love for the novel, made adapting \u003ci\u003e\u003cstrong\u003eEast of Eden\u003c/strong\u003e\u003c/i\u003e a deeply personal and resonant experience for Zoe Kazan. To celebrate the captivating results of her work, the Paris Theater is proud to present \u003cstrong\u003eThe Monster in All of Us: The Films Behind \u003c/strong\u003e\u003ci\u003e\u003cstrong\u003eEast of Eden\u003c/strong\u003e\u003c/i\u003e, a week-long repertory film series curated in collaboration with Zoe Kazan showcasing films across cinema history that were key inspirations for Kazan throughout her creative process.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eKazan has always been drawn to the character of Cathy Ames – whose enigmatic nature and uncommon sense of agency fascinated her. Many of the films in this series provided inspiration to Kazan as she unfolded more of Cathy’s character out of Steinbeck’s text, including the complex women contained in the performances of Jane Fonda in \u003ci\u003e\u003cstrong\u003eKlute\u003c/strong\u003e\u003c/i\u003e, Barbara Stanwyck in \u003ci\u003e\u003cstrong\u003eStella Dallas\u003c/strong\u003e\u003c/i\u003e, or Scarlett Johansson in \u003ci\u003e\u003cstrong\u003eUnder the Skin\u003c/strong\u003e\u003c/i\u003e. Kazan even found guidance in something Steinbeck once wrote about Cathy in his reflections on writing the novel: “They will forget I said she was bad. And they will hate her because while she is a monster, she is a little piece of the monster in all of us.”\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eThe Monster in All of Us \u003c/strong\u003ewill include a special, free screening of \u003ci\u003e\u003cstrong\u003eEast of Eden\u003c/strong\u003e\u003c/i\u003e episodes 1, 2 \u0026amp; 3 at the Paris Theater, followed by a \u003cstrong\u003eQ\u0026amp;A with Zoe Kazan on Saturday, October 3\u003c/strong\u003e. Later that evening, Kazan will introduce a 35mm presentation of the 1955 film adaptation of \u003ci\u003e\u003cstrong\u003eEast of Eden\u003c/strong\u003e\u003c/i\u003e, directed by Elia Kazan and starring James Dean, Raymond Massey, and Jo Van Fleet in an Academy Award®-winning performance as Cathy.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eZoe Kazan will also give special in-person introductions\u003c/strong\u003e to a 35mm presentation of \u003ci\u003e\u003cstrong\u003eKlute\u003c/strong\u003e\u003c/i\u003e on \u003cstrong\u003eFriday, October 2 at 6:45 PM\u003c/strong\u003e and to Alfred Hitchcock’s \u003ci\u003e\u003cstrong\u003eNotorious\u003c/strong\u003e\u003c/i\u003e on \u003cstrong\u003eSunday, October 4 at 5:45 PM\u003c/strong\u003e.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eSelect screenings will feature pre-recorded introductions from Zoe Kazan, discussing how each film influenced her work on the series.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"1e:T9f7,"])</script><script>self.__next_f.push([1,"\u003cp\u003eFollowing its World Premiere at the Cannes Film Festival in May, where filmmakers\u0026nbsp;\u003cstrong\u003eJavier Calvo\u0026nbsp;\u003c/strong\u003eand\u0026nbsp;\u003cstrong\u003eJavier Ambrossi\u0026nbsp;\u003c/strong\u003ewere awarded the Best Director Prize, and its recent TIFF People’s Choice Award win at the Toronto International Film Festival and Audience Award for Best Film at San Sebastian Film Festival,\u0026nbsp;\u003ca href=\"https://www.paristheaternyc.com/film/la-bola-negra-paris\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003e\u003cstrong\u003eLa Bola Negra\u003c/strong\u003e\u003c/i\u003e\u003c/a\u003e\u003cstrong\u003e\u0026nbsp;\u003c/strong\u003ewill arrive at the Paris Theater on October 16 in a 35mm engagement.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eA bold tapestry spanning nearly a century of Spanish history,\u0026nbsp;\u003ci\u003eLa Bola Negra\u0026nbsp;\u003c/i\u003efollows three generations of men across pivotal moments in Spanish history: 1932, 1937, and 2017. Carlos (Milo Quifes) longs to belong in a fractured Spain. Sebastián (Guitarricadelafuente) finds connection across enemy lines. And Alberto (Carlos González) uncovers a long-buried family secret — one that finally gives voice to truths the past tried to erase. Academy Award winner\u0026nbsp;Penelope Cruz and three-time Golden Globe winner\u0026nbsp;Glenn Close make special appearances.\u0026nbsp;\u003cbr\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eTo celebrate the arrival of Calvo and Ambrossi’s eagerly anticipated film, The Paris Theater is proud to present\u0026nbsp;\u003cstrong\u003eQueer, Period.\u003c/strong\u003e, a repertory film series curated in collaboration with Ambrossi and Calvo, and inspired by\u0026nbsp;\u003ci\u003eLa Bola Negra\u003c/i\u003e’s story of freedom, legacy, and LGBTQ+ visibility.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eThe films in\u003ci\u003e\u003cstrong\u003e \u003c/strong\u003e\u003c/i\u003e\u003cstrong\u003eQueer, Period.\u003c/strong\u003e use the form of the traditional period piece to re-examine history through a queer lens, centering bold, radical and romantic works from some of international cinema’s most heralded auteurs:\u0026nbsp; experience Sally Potter’s adaptation of Virginia Woolf’s\u0026nbsp;\u003ci\u003eOrlando\u003c/i\u003e, Rainer Werner Fassbinder’s final and perhaps most provocative film\u0026nbsp;\u003ci\u003eQuerelle\u003c/i\u003e, Derek Jarman’s erotically-charged debut feature\u0026nbsp;\u003ci\u003eSebastiane\u003c/i\u003e, James Ivory’s interpretation of E.M. Forster’s romance\u0026nbsp;\u003ci\u003eMaurice\u003c/i\u003e, and electrifying Sapphic romances in locales like the English royal court (\u003ci\u003eThe Favourite\u003c/i\u003e), Japanese-ruled Korea (\u003ci\u003eThe Handmaiden\u003c/i\u003e), 18th-century France (\u003ci\u003ePortrait of a Lady on Fire\u003c/i\u003e) and 1950s New York (\u003ci\u003eCarol\u003c/i\u003e).\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003ci\u003e\u003cstrong\u003eLa Bola Negra\u003c/strong\u003e\u003c/i\u003e arrives in select theaters on October 16, including a 35mm run at the Paris Theater.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"1f:T466,\u003cp\u003e\u003ci\u003e\u003cstrong\u003e4K Restoration! \u003c/strong\u003e\u003c/i\u003eSet against the stifling conformity of pre-World War I English society, E.M. Forster's \u003ci\u003e\u003cstrong\u003eMaurice\u003c/strong\u003e\u003c/i\u003e is a story of coming to terms with one's sexuality and identity in the face of disapproval and misunderstanding. Maurice Hall (James Wilby) and Clive Durham (Hugh Grant) find themselves falling in love at Cambridge. In a time when homosexuality is punishable by imprisonment, the two must keep their feelings for one another a complete secret. After a friend is arrested and disgraced for the \"unspeakable vice of the Greeks,\" Clive abandons his forbidden love and marries a young woman. Maurice, however, struggles with his identity and self-confidence, seeking the help of a hypnotist to rid himself of his undeniable urges. But while staying with Clive and his shallow wife, Anne, Maurice is seduced by the affectionate and yearning servant Alec Scudder (Rupert Graves), an event that brings about profound changes in Maurice's life and outlook.\u003cbr\u003e\u003cbr\u003e\u003ci\u003ePrevious in-person appearances: Q\u0026amp;A with director James Ivory, moderated by Ira Sachs in 2025\u003c/i\u003e\u003c/p\u003e20:T798,\u003cp\u003eThis Fall, the Paris Theater is thrilled to welcome\u0026nbsp;\u003cstrong\u003eKarina Longworth\u003c/strong\u003e, the creator, writer, producer and narrator of\u0026nbsp;\ s Lee’s first film in eight years.\",\"Link\":\"https://www.netflix.com/tudum/articles/possible-love-cast-release-date-photos\",\"ArticleDate\":\"2026-08-26\"}],\"PhotoGallery\":{\"data\":null},\"films\":{\"data\":[{\"id\":1993,\"attributes\":{\"FilmName\":\"Peppermint Candy\",\"Slug\":\"peppermint-candy-paris\",\"TrailerLink\":null,\"Director\":\"Lee Chang-dong\",\"Cast\":\"Sol Kyung-gu, \\nMoon So-ri, \\nKim Yeo-jin\",\"OpeningDate\":\"2026-09-26\",\"Synopsis\":\"Yongho (Sul Kyung-gu) stares down an oncoming train as twenty years of his life flash before his eyes. Proceeding to move backward in time, Lee Chang-dong's acclaimed second directorial feature rewinds the protagonist's loss of humanity - from his fraught, self-hating middle age through his callow teens. The moments in between these events, as seen through the lens of Yongho’s oppressive struggles, mirror South Korea’s traumatic political history during the late 20th century.\\n\\nAn official selection of the Directors' Fortnight selection in Cannes and winner of the Special Prize of the Jury at the Karlovy Vary International Film Festival, PEPPERMINT CANDY is a powerful work of Korean New Wave cinema that elegizes a generation of marginalized people with “quiet, heartbreaking power” (The New York Times). Presented in a 4K restoration.\",\"Rating\":null,\"Runtime\":129,\"VistaID\":null,\"IsComingSoon\":null,\"IsFeatured\":false,\"ClosingDate\":\"2026-09-26\",\"FeaturedFilmLabel\":\"Lee Chang-dong\",\"FeaturedFilmSubtextOverride\":null,\"HeroDetails\":\"Q\u0026A with director Lee Chang-dong and actor Sul Kyung-gu on September 26\",\"RedLabelOverride\":\"Freedom and Desire: The Films of Lee Chang-dong\",\"IsAmericanCinematheque\":null,\"AmericanCinemathequeFeaturedTicketsLink\":null,\"PhotoGalleryIntroCopy\":null,\"SynopsisWYSIWYG\":\"$1b\",\"FilmFormat\":\"DCP\",\"HasThirdPartyTicketLink\":null,\"ThirdPartyTicketLink\":null,\"createdAt\":\"2026-09-01T16:17:28.551Z\",\"updatedAt\":\"2026-09-26T15:00:12.815Z\",\"publishedAt\":\"2026-09-14T19:28:35.427Z\",\"Association\":[\"Paris\"],\"VistaIDOverride\":\"HO00001538\",\"Year\":\"2000\",\"Accessibility\":[\"hi\"],\"Language\":\"Korean with English subtitles\",\"DisplayTitle\":\"Peppermint Candy - \u003cParis\u003e\",\"HideDates\":null,\"SearchKeywords\":null,\"Distributor\":null,\"PrintSource\":null,\"TheatricalOpeningDate\":null}},{\"id\":1991,\"attributes\":{\"FilmName\":\"Green Fish\",\"Slug\":\"green-fish-paris\",\"TrailerLink\":null,\"Director\":\"Lee Chang-dong\",\"Cast\":\"Han Suk-kyu, \\nShim Hye-jin, \\nMoon Sung-Keun, \\nYu-Kyeong Cha, \\nSong Kang-ho\",\"OpeningDate\":\"2026-10-03\",\"Synopsis\":\"Released from his mandatory military service, Makdong (Han Suk-gyu) returns to a hometown he no longer recognizes. After rescuing a beautiful young woman from harassment on a train, his life takes an unexpected turn when she unwittingly lures him into the criminal underworld. Finding himself in a dangerous love triangle with the local crime boss, Makdong must face the dire consequences of his choices.\\n\\nWinner of the Best Film and Best New Director awards from the Korean Film Critics Association, Lee Chang-dong's GREEN FISH is a “wrenching, tonally nuanced first film” (Senses of Cinema) that combines “strong narrative drive, powerful visuals and a mind-blowing central performance” (Eastern Kicks). Presented in a 4K restoration.\",\"Rating\":null,\"Runtime\":111,\"VistaID\":null,\"IsComingSoon\":null,\"IsFeatured\":false,\"ClosingDate\":\"2026-10-03\",\"FeaturedFilmLabel\":\"Lee Chang-dong\",\"FeaturedFilmSubtextOverride\":null,\"HeroDetails\":\"Lee Chang-dong's POSSIBLE LOVE opens in theaters on October 23, on Netflix November 6\",\"RedLabelOverride\":\"Freedom and Desire: The Films of Lee Chang-dong\",\"IsAmericanCinematheque\":null,\"AmericanCinemathequeFeaturedTicketsLink\":null,\"PhotoGalleryIntroCopy\":null,\"SynopsisWYSIWYG\":\"\u003cp\u003e\u003ci\u003e\u003cstrong\u003e4K Restoration! \u003c/strong\u003e\u003c/i\u003eReleased from his mandatory military service, Makdong (Han Suk-gyu) returns to a hometown he no longer recognizes. After rescuing a beautiful young woman from harassment on a train, his life takes an unexpected turn when she unwittingly lures him into the criminal underworld. Finding himself in a dangerous love triangle with the local crime boss, Makdong must face the dire consequences of his choices.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eWinner of the Best Film and Best New Director awards from the Korean Film Critics Association, Lee Chang-dong's \u003ci\u003e\u003cstrong\u003eGreen Fish \u003c/strong\u003e\u003c/i\u003eis a “wrenching, tonally nuanced first film” (\u003ci\u003eSenses of Cinema\u003c/i\u003e) that combines “strong narrative drive, powerful visuals and a mind-blowing central performance” (\u003ci\u003eEastern Kicks\u003c/i\u003e).\u003c/p\u003e\",\"FilmFormat\":\"DCP\",\"HasThirdPartyTicketLink\":null,\"ThirdPartyTicketLink\":null,\"createdAt\":\"2026-09-01T16:09:51.787Z\",\"updatedAt\":\"2026-10-03T15:00:10.101Z\",\"publishedAt\":\"2026-09-14T19:28:36.992Z\",\"Association\":[\"Paris\"],\"VistaIDOverride\":\"HO00001536\",\"Year\":\"1997\",\"Accessibility\":[\"hi\"],\"Language\":\"Korean with English subtitles\",\"DisplayTitle\":\"Green Fish - \u003cParis\u003e\",\"HideDates\":null,\"SearchKeywords\":null,\"Distributor\":null,\"PrintSource\":null,\"TheatricalOpeningDate\":null}},{\"id\":1992,\"attributes\":{\"FilmName\":\"Oasis\",\"Slug\":\"oasis-paris\",\"TrailerLink\":null,\"Director\":\"Lee Chang-dong\",\"Cast\":\"Sol Kyung-gu, \\nMoon So-ri\",\"OpeningDate\":\"2026-10-04\",\"Synopsis\":\"Fresh out of prison, Hong Jong-du (Sul Kyung-gu) finds an unlikely soulmate in Gong-ju (Moon So-ri), the daughter of the victim of the hit-and-run accident for which he went to jail. Wheelchair-bound and suffering from severe cerebral palsy, Gong-ju is kept cloistered in a cheap apartment by her brother, whose only concern is the government assistance she receives. Over a series of clandestine meetings, the two begin an improbable relationship that defies the judgment and cruelty of the world around them.\\n\\n\\n\\nWinner of the Silver Lion for Best Director and Best Young Actress at the Venice Film Festival, Lee Chang-dong's OASIS is a “brave film” that “shows two people who find any relationship almost impossible, and yet find a way to make theirs work” (Roger Ebert, Chicago Sun-Times). Presented in a  4K restoration.\",\"Rating\":null,\"Runtime\":133,\"VistaID\":null,\"IsComingSoon\":null,\"IsFeatured\":false,\"ClosingDate\":\"2026-10-04\",\"FeaturedFilmLabel\":\"Lee Chang-dong\",\"FeaturedFilmSubtextOverride\":null,\"HeroDetails\":\"Lee Chang-dong's POSSIBLE LOVE opens in theaters on October 23, on Netflix November 6\",\"RedLabelOverride\":\"Freedom and Desire: The Films of Lee Chang-dong\",\"IsAmericanCinematheque\":null,\"AmericanCinemathequeFeaturedTicketsLink\":null,\"PhotoGalleryIntroCopy\":null,\"SynopsisWYSIWYG\":\"\u003cp\u003e\u003ci\u003e\u003cstrong\u003e4K Restoration! \u003c/strong\u003e\u003c/i\u003eFresh out of prison, Hong Jong-du (Sul Kyung-gu) finds an unlikely soulmate in Gong-ju (Moon So-ri), the daughter of the victim of the hit-and-run accident for which he went to jail. Wheelchair-bound and suffering from severe cerebral palsy, Gong-ju is kept cloistered in a cheap apartment by her brother, whose only concern is the government assistance she receives. Over a series of clandestine meetings, the two begin an improbable relationship that defies the judgment and cruelty of the world around them.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eWinner of the Silver Lion for Best Director and Best Young Actress at the Venice Film Festival, Lee Chang-dong's \u003ci\u003e\u003cstrong\u003eOasis\u003c/strong\u003e\u003c/i\u003e is a “brave film” that “shows two people who find any relationship almost impossible, and yet find a way to make theirs work” ( ricanCinematheque\":false,\"AmericanCinemathequeFeaturedTicketsLink\":null,\"PhotoGalleryIntroCopy\":null,\"SynopsisWYSIWYG\":\"\u003cp\u003eIn an adaptation of Patricia Highsmith's seminal novel \u003ci\u003eThe Price of Salt\u003c/i\u003e, \u003ci\u003e\u003cstrong\u003eCarol\u003c/strong\u003e\u003c/i\u003e follows two women from very different backgrounds who find themselves in an unexpected love affair in 1950s New York. As conventional norms of the time challenge their undeniable attraction, an honest story emerges to reveal the resilience of the heart in the face of change. A young woman in her 20s, Therese Belivet (Rooney Mara), is a clerk working in a Manhattan department store and dreaming of a more fulfilling life when she meets Carol (Cate Blanchett), an alluring woman trapped in a loveless, convenient marriage. As an immediate connection sparks between them, the innocence of their first encounter dims and their connection deepens. While Carol breaks free from the confines of marriage, her husband (Kyle Chandler) begins to question her competence as a mother as her involvement with Therese and close relationship with her best friend Abby (Sarah Paulson) come to light.\u003c/p\u003e\",\"FilmFormat\":\"DCP\",\"HasThirdPartyTicketLink\":false,\"ThirdPartyTicketLink\":null,\"createdAt\":\"2025-12-16T19:41:56.030Z\",\"updatedAt\":\"2026-10-06T15:00:08.071Z\",\"publishedAt\":\"2026-09-30T16:25:04.342Z\",\"Association\":[\"Paris\"],\"VistaIDOverride\":\"HO00001214\",\"Year\":\"2015\",\"Accessibility\":[\"hi\",\"cc\",\"ad\"],\"Language\":null,\"DisplayTitle\":\"Carol - \u003cParis\u003e\",\"HideDates\":null,\"SearchKeywords\":null,\"Distributor\":null,\"PrintSource\":null,\"TheatricalOpeningDate\":null}},{\"id\":868,\"attributes\":{\"FilmName\":\"The Handmaiden\",\"Slug\":\"the-handmaiden-paris\",\"TrailerLink\":null,\"Director\":\"Park Chan-wook\",\"Cast\":\"Kim Min-hee, \\nKim Tae-ri, \\nHa Jung-woo, \\nCho Jin-woong\",\"OpeningDate\":\"2026-10-08\",\"Synopsis\":\"From PARK Chan-wook, the celebrated director of OLDBOY, LADY VENGEANCE and STOKER, comes a ravishing new crime drama. PARK presents a gripping and sensual tale of two women - a young Japanese Lady living on a secluded estate, and a Korean woman who is hired to serve as her new handmaiden, but is secretly plotting with a conman to defraud her of a large inheritance. Inspired by the novel Fingersmith by British author Sarah Waters, THE HANDMAIDEN borrows the most dynamic elements of its source material and combines it with PARK Chan-wook’s singular vision to create an unforgettable viewing experience.\",\"Rating\":null,\"Runtime\":145,\"VistaID\":null,\"IsComingSoon\":false,\"IsFeatured\":false,\"ClosingDate\":\"2026-10-08\",\"FeaturedFilmLabel\":\"Queer, Period.\",\"FeaturedFilmSubtextOverride\":\"Thu Oct 8\",\"HeroDetails\":\"LA BOLA NEGRA opens at the Paris in 35mm starting October 16\",\"RedLabelOverride\":\"Queer, Period.\",\"IsAmericanCinematheque\":false,\"AmericanCinemathequeFeaturedTicketsLink\":null,\"PhotoGalleryIntroCopy\":null,\"SynopsisWYSIWYG\":\"\u003cp\u003eFrom Park Chan-wook, the celebrated director of \u003ci\u003eOldboy, Lady Vengeance \u003c/i\u003eand \u003ci\u003eStoker, \u003c/i\u003ecomes a ravishing new crime drama. Park presents a gripping and sensual tale of two women - a young Japanese Lady living on a secluded estate, and a Korean woman who is hired to serve as her new handmaiden, but is secretly plotting with a conman to defraud her of a large inheritance. Inspired by the novel Fingersmith by British author Sarah Waters, \u003ci\u003e\u003cstrong\u003eThe Handmaiden\u003c/strong\u003e\u003c/i\u003e borrows the most dynamic elements of its source material and combines it with Park Chan-wook’s singular vision to create an unforgettable viewing experience.\u003c/p\u003e\",\"FilmFormat\":\"DCP\",\"HasThirdPartyTicketLink\":false,\"ThirdPartyTicketLink\":null,\"createdAt\":\"2025-02-10T20:08:58.939Z\",\"updatedAt\":\"2026-10-06T15:00:06 myriad of genres, tones, and time periods. Whether you’re looking to lose yourself in passionate affairs from bygone eras, young first loves, or volatile relationships that seemed destined for tragedy,\u0026nbsp;\u003ci\u003eA Century of Romance\u003c/i\u003e will pull on your heartstrings in more ways than one, collecting dozens of great love stories into four categories:\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003cbr\u003e\u0026nbsp;\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003ci\u003eSilents \u0026amp; Screwballs\u003c/i\u003e, starting March 5\u003c/li\u003e\u003cli\u003e\u003ci\u003eAn Unlikely Pair\u003c/i\u003e, starting March 21\u003c/li\u003e\u003cli\u003e\u003ci\u003eLovers Abroad and Against the Odds\u003c/i\u003e, starting April 4\u003c/li\u003e\u003cli\u003e\u003ci\u003eAll’s Fair in Love and Boors: Lubitsch \u0026amp; Sturges\u003c/i\u003e, starting April 11\u0026nbsp;\u0026nbsp;\u003cbr\u003e\u0026nbsp;\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eA special guest joining us during this series will be\u0026nbsp;\u003cstrong\u003eMatthew Modine\u003c/strong\u003e, who celebrates the 40th anniversary of\u0026nbsp;\u003ca href=\"https://www.paristheaternyc.com/film/vision-quest-romance\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003e\u003cstrong\u003eVision Quest\u003c/strong\u003e\u003c/i\u003e\u003c/a\u003e\u003cstrong\u003e\u0026nbsp;\u003c/strong\u003eat the Paris on Thursday, March 13. The film will screen from an archival 35mm print courtesy of Warner Bros.\u0026nbsp;\u0026nbsp;\u003cbr\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003ci\u003e\u003cstrong\u003eA Century of Romance\u003c/strong\u003e\u003c/i\u003e features 54 films, including 28 on 35mm. Film lovers of any age are guaranteed to find a new favorite amidst this abundant celebration of screwball comedy, tear-jerking drama, period costumes, and modern heartache….all in the name of love!\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003cbr\u003e\u0026nbsp;\u003c/p\u003e\u003ch3\u003e\u003cstrong\u003e\u003cu\u003eHighlights of the Series include:\u003c/u\u003e\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003e\u003cbr\u003e\u003cstrong\u003ePREVIOUS IN-PERSON APPEARANCES:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cstrong\u003eWednesday, April 2:\u0026nbsp;\u003c/strong\u003e 4K Restoration of \u003ca href=\"https://www.paristheaternyc.com/film/maurice-romance\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eMaurice\u003c/i\u003e\u003c/a\u003e\u003ci\u003e, \u003c/i\u003efollowed by a Q\u0026amp;A with director James Ivory, moderated by Ira Sachs (\u003ci\u003ePassages\u003c/i\u003e).\u0026nbsp;\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eMonday, April 14: \u003c/strong\u003eDouble feature of \u003ca href=\"https://www.paristheaternyc.com/film/sullivans-travels-to-be-or-not-to-be-romance\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eSullivan's Travels + To Be or Not to Be\u003c/i\u003e\u003c/a\u003e\u003ci\u003e \u003c/i\u003eintroduced by Annette Insdorf, Columbia University Film Professor.\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003cstrong\u003e\u003cu\u003eWORLD PREMIERE OF 4K RESTORATION\u003c/u\u003e:\u003c/strong\u003e\u0026nbsp;\u003ca href=\"https://www.paristheaternyc.com/film/out-of-africa-romance\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003e\u003cstrong\u003eOut of Africa\u003c/strong\u003e\u003c/i\u003e\u003c/a\u003e\u003c/p\u003e\u003cp\u003eCelebrating its 40th Anniversary this year, seven-time Academy Award-winning\u0026nbsp;\u003ca href=\"https://www.paristheaternyc.com/film/out-of-africa-romance\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eOut of Africa\u003c/i\u003e\u003c/a\u003e, directed by Sydney Pollack and starring Meryl Streep and Robert Redford, makes its 4K Restoration debut at the Paris.\u003ci\u003e\u0026nbsp;\u003c/i\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003cstrong\u003e\u003cu\u003eARCHIVAL 35MM PRINTS:\u003c/u\u003e\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003ca href=\"https://www.paristheaternyc.com/film/letter-from-an-unknown-woman-romance\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eLetter from an Unknown Woman\u003c/i\u003e\u003c/a\u003e, courtesy of the UCLA Film \u0026amp; Television Archive\u003c/p\u003e\u003cp\u003e\u003ca href=\"https://www.paristheaternyc.com/film/morocco-romance\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eMorocco\u003c/i\u003e\u003c/a\u003e\u003ci\u003e,\u003c/i\u003e preserved by the Library of Congress\u003c/p\u003e\u003cp\u003e\u003ca href=\"https://www.paristheaternyc.com/film/my-favorite-wife-romance\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eMy Favorite Wife\u003c/i\u003e\u003c/a\u003e\u003ci\u003e,\u003c/i\u003e preserved by the Library of Congress\u003c/p\u003e\u003cp\u003e\u003ca href=\"https://www.paristheaternyc.com/film/shop-around-the-corner-hail-romance\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eThe Shop Around the Corner\u003c/i\u003e\u003c/a\u003e\u003ci\u003e,\u003c/i\u003e from the Collection of the Library of Congress\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003ch3\u003e\u003cstrong\u003e\u003cu\u003eA Century of Romance in Four Weeks:\u003c/u\u003e\u003c/strong\u003e\u0026nbsp;\u0026nbsp;\u003cbr\u003e\u003cbr\u003e\u003cstrong\u003eSilents \u0026amp; Screwballs, starting March 5\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003eFrom the early days of Hollywood, romance was writ large onscreen by the silent clowns like Chaplin and Keaton, as well as captivating silent dramas. When sound took over, the rapid fire dialogue and farcical plots of the great screwball comedies took over, whose inspiration stretched onward through the decades.\u0026nbsp; Films this week include:\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003ca href=\"https://www.paristheaternyc.com/film/a lities. Discover the joy of watching the unlikely become inevitable in these films:\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003ca href=\"https://www.paristheaternyc.com/film/amelie-valentines-day\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eAmélie\u003c/i\u003e\u003c/a\u003e |\u003cspan style=\"background-color:transparent;color:#000000;\"\u003e \u003c/span\u003e\u003ca href=\"https://www.paristheaternyc.com/film/but-im-a-cheerleader-romance\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eBut I’m a Cheerleader\u003c/i\u003e\u003c/a\u003e (4K Restoration DCP) |\u003cspan style=\"background-color:transparent;color:#000000;\"\u003e \u003c/span\u003e\u003ca href=\"https://www.paristheaternyc.com/film/claudine-romance\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eClaudine\u003c/i\u003e\u003c/a\u003e (4K DCP) | \u003ca href=\"https://www.paristheaternyc.com/film/harold-and-maude-romance\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eHarold and Maude\u003c/i\u003e\u003c/a\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003e\u003ci\u003e \u003c/i\u003e| \u003c/span\u003e\u003ca href=\"https://www.paristheaternyc.com/film/her-romance\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eHer\u003c/i\u003e\u003c/a\u003e |\u003cspan style=\"background-color:transparent;color:#000000;\"\u003e \u003c/span\u003e\u003ca href=\"https://www.paristheaternyc.com/film/la-belle-et-la-bete-romance\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eLa Belle et la Bête (Beauty and the Beast)\u003c/i\u003e\u003c/a\u003e (35mm) |\u003cspan style=\"background-color:transparent;color:#000000;\"\u003e \u003c/span\u003e\u003ca href=\"https://www.paristheaternyc.com/film/moonstruck-romance\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eMoonstruck\u003c/i\u003e\u003c/a\u003e (35mm) |\u003cspan style=\"background-color:transparent;color:#000000;\"\u003e me-by-your-name-romance\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eCall Me By Your Name\u003c/i\u003e\u003c/a\u003e |\u003cspan style=\"background-color:transparent;color:#000000;\"\u003e \u003c/span\u003e\u003ca href=\"https://www.paristheaternyc.com/film/casablanca-valentines-day\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eCasablanca\u003c/i\u003e\u003c/a\u003e (4K DCP) | \u003ca href=\"https://www.paristheaternyc.com/film/certified-copy-romance\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eCertified Copy\u003c/i\u003e\u003c/a\u003e | \u003ca href=\"https://www.paristheaternyc.com/film/the-english-patient-romance\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eThe English Patient\u003c/i\u003e\u003c/a\u003e |\u003cspan style=\"background-color:transparent;color:#000000;\"\u003e \u003c/span\u003e\u003ca href=\"https://www.paristheaternyc.com/film/the-handmaiden-romance\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eThe Handmaiden\u003c/i\u003e\u003c/a\u003e |\u003cspan style=\"background-color:transparent;color:#000000;\"\u003e \u003c/span\u003e\u003ca href=\"https://www.paristheaternyc.com/film/letter-from-an-unknown-woman-romance\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eLetter From an Unknown Woman\u003c/i\u003e\u003c/a\u003e (35mm courtesy of the UCLA Film \u0026amp; Television Archive) |\u003cspan style=\"background-color:transparent;color:#000000;\"\u003e \u003c/span\u003e\u003ca href=\"https://www.paristheaternyc.com/film/lost-in-translation-romance\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eLost in Translation\u003c/i\u003e\u003c/a\u003e (35mm) |\u003cspan style=\"background-color:transparent;color:#000000;\"\u003e \u003c/span\u003e\u003ca href=\"https://www.paristheaternyc.com/film/love-and-basketball-romance\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eLove \u0026amp; Basketball\u003c/i\u003e\u003c/a\u003e (4K DCP) |\u003cspan style=\"background-color:transparent;color:#000000;\"\u003e \u003c/span\u003e\u003ca href=\"https://www.paristheaternyc.com/film/medicine-for-melancholy-romance\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eMedicine for Melancholy\u003c/i\u003e\u003c/a\u003e |\u003cspan style=\"background-color:transparent;color:#000000;\"\u003e \u003c/span\u003e\u003ca href=\"https://www.paristheaternyc.com/film/morocco-romance\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eMorocco\u003c/i\u003e\u003c/a\u003e (35mm, preserved by the Library of Congress) |\u003cspan style=\"background-color:transparent;color:#000000;\"\u003e \u003c/span\u003e\u003ca href=\"https://www.paristheaternyc.com/film/now-voyager-romance\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eNow,\u003c/i\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003e \u003c/span\u003e\u003ci\u003eVoyager\u003c/i\u003e\u003c/a\u003e (35mm) |\u003cspan style=\"background-color:transparent;color:#000000;\"\u003e \u003c/span\u003e\u003ca href=\"https://www.paristheaternyc.com/film/out-of-africa-romance\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eOut of Africa\u003c/i\u003e\u003c/a\u003e (4K Restoration World Premiere) |\u003cspan style=\"background-color:transparent;color:#000000;\"\u003e \u003c/span\u003e\u003ca href=\"https://www.paristheaternyc.com/film/a-place-in-the-sun-romance\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eA Place in the Sun\u003c/i\u003e\u003c/a\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003e\u003ci\u003e \u003c/i\u003e| \u003c/span\u003e\u003ca href=\"https://www.paristheaternyc.com/film/summertime-romance\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eSummertime\u003c/i\u003e\u003c/a\u003e (35mm) |\u003cspan style=\"background-color:transparent;color:#000000;\"\u003e \u003c/span\u003e\u003ca href=\"https://www.paristheaternyc.com/film/they-live-by-night-romance\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eThey Live By Night\u003c/i\u003e\u003c/a\u003e (35mm)\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003ch3\u003e\u003cstrong\u003eAll’s Fair in Love and Boors: Lubitsch \u0026amp; Sturges, starting April 11\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003e\u003ci\u003eA Century of Romance\u003c/i\u003e’s final week will bring you a fantastic collection of double-features that pair enduring classics from two of Hollywood’s most celebrated filmmakers - Ernst Lubitsch and Preston Sturges - in a series we’re calling\u0026nbsp;\u003ci\u003e\u003cstrong\u003eAll’s Fair in Love and Boors\u003c/strong\u003e\u003c/i\u003e, a fitting title for two filmographies that frequently depicted tug-of-war romances with haughty men and clever women battling for the upper hand. During this final week, we’ll also show 1935’s\u0026nbsp;\u003ca href=\"https://www.paristheaternyc.com/film/the-good-fairy-romance\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003e\u003cstrong\u003eThe Good Fairy\u003c/strong\u003e\u003c/i\u003e\u003c/a\u003e, an under-appreciated discovery that feels like it could have been a collaboration by the two auteurs, on 35mm. Years before he became a director, screenwriter Sturges adapted this contemporary Hungarian play, replete with a cast of Lubitsch veterans: Margaret Sullivan, Herbert Marshall and Frank Morgan. But the script’s dazzling comedic wordplay is pure Sturges, and - on first viewing - you’ll find yourself wondering if this is Lubitsch adapting Sturges or Sturges channeling Lubitsch! (The film was, in fact, directed by William Wyler.)\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003ca href=\"https://www.paristheaternyc.com/film/shop-around-the-corner-hail-romance\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eThe Shop Around the Corner\u003c/i\u003e (35mm, part of the Collection of the Library of Congress) \u0026amp;\u0026nbsp;\u003ci\u003eHail the Conquering Hero\u0026nbsp;\u003c/i\u003e(35mm)\u003c/a\u003e\u003c/li\u003e\u003cli\u003e\u003ca href=\"https://www.paristheaternyc.com/film/sullivans-travels-to-be-or-not-to-be-romance\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eSullivan’s Travels\u0026nbsp;\u003c/i\u003e(35mm) \u0026amp;\u0026nbsp;\u003ci\u003eTo Be Or Not To Be\u003c/i\u003e\u003c/a\u003e\u003c/li\u003e\u003cli\u003e\u003ca href=\"https://www.paristheaternyc.com/film/ninotchka-palm-beach-story-romance\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eNinotchka\u0026nbsp;(35mm) \u0026amp;\u0026nbsp;The Palm Beach Story (35mm)\u003c/i\u003e\u003c/a\u003e\u003c/li\u003e\u003cli\u003e\u003ca href=\"https://www.paristheaternyc.com/film/trouble-in-paradise-lady-eve-romance\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eTrouble in Paradise\u003c/i\u003e (35mm) \u0026amp;\u0026nbsp;\u003ci\u003eThe Lady Eve\u003c/i\u003e (35mm)\u003c/a\u003e\u003c/li\u003e\u003cli\u003e\u003ca href=\"https://www.paristheaternyc.com/film/design-for-living-morgans-creek-romance\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eDesign For Living\u003c/i\u003e (35mm) \u0026amp;\u0026nbsp;\u003ci\u003eThe Miracle of Morgan’s Creek\u003c/i\u003e\u003c/a\u003e\u003c/li\u003e\u003cli\u003e\u003ca href=\"https://www.paristheaternyc.com/film/bluebeard-unfaithfully-yours-romance\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eBluebeard’s Eighth Wife\u003c/i\u003e (35mm) \u0026amp;\u0026nbsp;\u003ci\u003eUnfaithfully Yours\u003c/i\u003e (4K DCP)\u003c/a\u003e\u003c/li\u003e\u003cli\u003e\u003ca href=\"https://www.paristheaternyc.com/film/the-good-fairy-romance\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eThe Good Fairy\u003c/i\u003e\u003c/a\u003e (35mm)\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eIn celebration of all things “love,” you can also \u003ca href=\"https://www.netflix.com/browse/genre/8883\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e“Match with Your Perfect Love Story” with a brand-new Collection\u003c/a\u003e of series and films designed for every kind of romantic journey, right in your Netflix queue. In addition to new Netflix movies like \u003ci\u003eKinda Pregnant\u003c/i\u003e, \u003ci\u003eLa Dolce Villa\u003c/i\u003e alongside beloved favorites like\u003ci\u003e To All the Boys, Set It Up, Always Be My Maybe\u003c/i\u003e and \u003ci\u003eThe Kissing Booth\u003c/i\u003e, you can also discover licensed films like \u003ci\u003e13 Going on 30\u003c/i\u003e and \u003ci\u003eNotting Hill\u003c/i\u003e to \u003ci\u003eSixteen Candles \u003c/i\u003eand\u003ci\u003e An Affair to Remember\u003c/i\u003e.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"36:T798,\u003cp\u003eThis Fall, the Paris Theater is thrilled to welcome\u0026nbsp;\u003cstrong\u003eKarina Longworth\u003c/strong\u003e, the creator, writer, producer and narrator of\u0026nbsp;\u003ca href=\"https://www.youmustrememberthispodcast.com/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003e\u003cstrong\u003eYou Must Remember This\u003c/strong\u003e\u003c/i\u003e\u003c/a\u003e,\u0026nbsp;the podcast dedicated to exploring the secret and/or forgotten histories of Hollywood's first century. Longworth will join us for two screenings in celebration of her podcast’s new season called \"The Bisexuals”, debuting September 15.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eSpanning eight episodes with\u0026nbsp;a cast of characters including Elizabeth Taylor, Montgomery Clift, Josephine Baker, Tallulah Bankhead, Billie Holiday, Jane and Paul Bowles, Nicholas Ray\u0026nbsp;and more, \"The Bisexuals\" will explore the story of Libby Holman, the sultry singer who became a Broadway sensation in the late 1920s and 30s, led a sexually fluid social life, and was embroiled in scandal when she was indicted for the murder of her husband, the heir to the R.J. Reynolds tobacco fortune.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eThis series features two screenings starring Montgomery Clift, one of the key players in Holman’s social circle:\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cul\u003e\u003cli\u003eOn Saturday, October 31 at 12:00 PM, Karina Longworth will give an extended introduction to an archival 35mm print of George Stevens’ A Place in the Sun (1951), starring Clift, Elizabeth Taylor and Shelley Winters. The film garnered nine Academy Award nominations, winning six including Best Director for Stevens. \u003cstrong\u003e35mm archival print from the Collection of the Library of Congress.\u003c/strong\u003e\u003cbr\u003e\u0026nbsp;\u003c/li\u003e\u003cli\u003eOn Sunday, November 1 at 6:15 PM, Karina Longworth will give an extended introduction to an archival 35mm print of Elia Kazan’s Wild River (1960), starring Clift, Lee Remick and Jo Van Fleet. \u003cstrong\u003e35mm archival print courtesy of the George Eastman Museum, lent by an anonymous collector.\u003c/strong\u003e\u003c/li\u003e\u003c/ul\u003e37:T798,\u003cp\u003eThis Fall, the Paris Theater is thrilled to welcome\u0026nbsp;\u003cstrong\u003eKarina Longworth\u003c/st"])</script><script>self.__next_f.push([1,"rong\u003e, the creator, writer, producer and narrator of\u0026nbsp;\u003ca href=\"https://www.youmustrememberthispodcast.com/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003e\u003cstrong\u003eYou Must Remember This\u003c/strong\u003e\u003c/i\u003e\u003c/a\u003e,\u0026nbsp;the podcast dedicated to exploring the secret and/or forgotten histories of Hollywood's first century. Longworth will join us for two screenings in celebration of her podcast’s new season called \"The Bisexuals”, debuting September 15.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eSpanning eight episodes with\u0026nbsp;a cast of characters including Elizabeth Taylor, Montgomery Clift, Josephine Baker, Tallulah Bankhead, Billie Holiday, Jane and Paul Bowles, Nicholas Ray\u0026nbsp;and more, \"The Bisexuals\" will explore the story of Libby Holman, the sultry singer who became a Broadway sensation in the late 1920s and 30s, led a sexually fluid social life, and was embroiled in scandal when she was indicted for the murder of her husband, the heir to the R.J. Reynolds tobacco fortune.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eThis series features two screenings starring Montgomery Clift, one of the key players in Holman’s social circle:\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cul\u003e\u003cli\u003eOn Saturday, October 31 at 12:00 PM, Karina Longworth will give an extended introduction to an archival 35mm print of George Stevens’ A Place in the Sun (1951), starring Clift, Elizabeth Taylor and Shelley Winters. The film garnered nine Academy Award nominations, winning six including Best Director for Stevens. \u003cstrong\u003e35mm archival print from the Collection of the Library of Congress.\u003c/strong\u003e\u003cbr\u003e\u0026nbsp;\u003c/li\u003e\u003cli\u003eOn Sunday, November 1 at 6:15 PM, Karina Longworth will give an extended introduction to an archival 35mm print of Elia Kazan’s Wild River (1960), starring Clift, Lee Remick and Jo Van Fleet. \u003cstrong\u003e35mm archival print courtesy of the George Eastman Museum, lent by an anonymous collector.\u003c/strong\u003e\u003c/li\u003e\u003c/ul\u003e38:T4b8,\u003cp\u003e\u003ci\u003eSouth Korea's official selection for International Feature Film at the 99th Academy Awards®\u003c/i\u003e\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003ci\u003eWinner - Silver Lion, Grand Jury Prize, Venice Film Festiva"])</script><script>self.__next_f.push([1,"l\u003c/i\u003e\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003ci\u003e\u003cstrong\u003e35mm print! \u003c/strong\u003e\u003c/i\u003eA story of two married couples — a laid-off worker and his spouse and a documentary filmmaker and her spouse — crossing paths to film a documentary and facing their different lives and hidden desires.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003ci\u003ePreceded by the US Premiere of\u003c/i\u003e\u003cbr\u003e\u003cbr\u003e\u003ci\u003e\u003cstrong\u003eHeartbeat \u003c/strong\u003e\u003c/i\u003e(2022, DCP, 28 min., produced by Qiao Cui)\u003cbr\u003eCaught up in anxiety, eight-year-old Chul in school tells his teacher that he is going to the bathroom, but runs straight home.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eWe are pleased to invite \u003c/strong\u003e\u003ci\u003e\u003cstrong\u003eAMPAS, SAG NOM COMM, BAFTA, PGA, DGA, WGA, ACE, ADG, ASC, CAS, CDG, CSA, MPEG, MPSE, SCL, VES\u003c/strong\u003e\u003c/i\u003e\u003cstrong\u003e Guild Members: Members and a guest are allowed complimentary entry to any public screening of new release titles on a space-available basis, upon presentation of your membership card at the venue box office 30 minutes prior to showtime (advance reservations not available).\u003c/strong\u003e\u003c/p\u003e39:Ta7a,"])</script><script>self.__next_f.push([1,"\u003cp\u003e\u003ci\u003e\u003cstrong\u003ePossible Love\u003c/strong\u003e\u003c/i\u003e, the first feature film in eight years from internationally acclaimed auteur\u0026nbsp;\u003cstrong\u003eLee Chang-dong\u003c/strong\u003e, will release in select theaters on October 23, and stream only on Netflix starting November 6. The film, which held its World Premiere at this year’s Venice Film Festival and won the Silver Lion Grand Jury Prize, follows the intertwined relationship of two married couples facing different paths and hidden desires.\u0026nbsp;\u003cbr\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eTo celebrate the release of Director Lee’s latest triumph, The Paris Theater is proud to announce\u0026nbsp;\u003cstrong\u003eFreedom and Desire: The Films of Lee Chang-dong\u003c/strong\u003e, the first retrospective of Director Lee’s in New York City to feature all eight of his films as director, including the U.S. premiere of the 2022 short film,\u0026nbsp;\u003ci\u003e\u003cstrong\u003eHeartbeat\u003c/strong\u003e\u003c/i\u003e\u003cstrong\u003e.\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eWhen discussing his latest film, Director Lee notes how\u0026nbsp;\u003ci\u003ePossible Love\u003c/i\u003e reflects his belief that no matter the pain, struggle, frustration and despair we face in life, what allows us to overcome these obstacles is our desire for freedom. This powerful notion echoes throughout his filmography, with characters constantly pursuing more than what their circumstances in life have given them –\u0026nbsp; from his first feature\u0026nbsp;\u003ci\u003e\u003cstrong\u003eGreen Fish\u003c/strong\u003e\u003c/i\u003e (1997) through his collection of award-winning masterpieces – including\u0026nbsp;\u003ci\u003e\u003cstrong\u003eOasis\u003c/strong\u003e\u003c/i\u003e (2002, Best Director at Venice FIlm Festival),\u0026nbsp;\u003ci\u003e\u003cstrong\u003eSecret Sunshine\u003c/strong\u003e\u003c/i\u003e (2007, Best Actress at Cannes Film Festival),\u0026nbsp;\u003ci\u003e\u003cstrong\u003ePoetry\u0026nbsp;\u003c/strong\u003e\u003c/i\u003e(2010, Best Screenplay at Cannes Film Festival), and\u0026nbsp;\u003ci\u003e\u003cstrong\u003eBurning\u003c/strong\u003e\u003c/i\u003e (2018, Cannes FIPRESCI Prize). Don’t miss the chance to experience all of these journeys at the Paris!\u0026nbsp;\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eThe series kicks off on Saturday, September 26 with 1999’s\u0026nbsp;\u003ci\u003e\u003cstrong\u003ePeppermint Candy\u003c/strong\u003e\u003c/i\u003e, followed by a Q\u0026amp;A with\u0026nbsp;\u003cstrong\u003eLee Chang-dong\u003c/strong\u003e and his longtime collaborator, actor\u0026nbsp;\u003cstrong\u003eSul Kyung-gu\u003c/strong\u003e (who also stars in\u0026nbsp;\u003ci\u003ePossible Love\u003c/i\u003e).\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eWe’ll close the series on November 24 with\u0026nbsp;\u003ci\u003e\u003cstrong\u003ePossible Love\u0026nbsp;\u003c/strong\u003e\u003c/i\u003e\u003cstrong\u003eon 35mm\u003c/strong\u003e, preceded by the U.S. premiere of Director Lee’s 2022 short film\u0026nbsp;\u003ci\u003e\u003cstrong\u003eHeartbeat\u003c/strong\u003e\u003c/i\u003e\u003cstrong\u003e.\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003ci\u003e\u003cstrong\u003ePossible Love\u003c/strong\u003e\u003c/i\u003e\u003cstrong\u003e opens in select theaters on October 23, including Film at Lincoln Center and Angelika Film Center in New York City. It streams only on Netflix starting November 6.\u003c/strong\u003e\u003c/p\u003e"])</script><script>self.__next_f.push([1,"9:[\"$\",\"$L2e\",null,{\"children\":[[\"$\",\"$L2f\",null,{\"sliderData\":[{\"id\":294,\"SlideTitle\":\"THE MONSTER IN ALL OF US\",\"SlideSubtext\":\"The Films Behind EAST OF EDEN | Starts October 1, special in person appearances by series creator Zoe Kazan, including a free screening of the first three episodes\",\"SlideLink\":\"https://www.paristheaternyc.com/series/east-of-eden-paris\",\"ButtonCopy\":\"SERIES INFO \u0026 TICKETS\",\"SlidePublishDate\":\"2026-09-22T15:00:00.000Z\",\"SlideUnPublishDate\":null,\"SlideContentVisuallyHidden\":true,\"SlideImage\":{\"data\":{\"id\":4642,\"attributes\":{\"name\":\"Paris_MonsterInAllOfUs_16x9Web.png\",\"alternativeText\":\"Series image for East of Eden\",\"caption\":null,\"width\":1920,\"height\":1080,\"formats\":{\"thumbnail\":{\"ext\":\".png\",\"url\":\"https://netflixstrapicentralcms.blob.core.windows.net/uploads/thumbnail_Paris_Monster_In_All_Of_Us_16x9_Web_97288ecbec.png\",\"hash\":\"thumbnail_Paris_Monste
