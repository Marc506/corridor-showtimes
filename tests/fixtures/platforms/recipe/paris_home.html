omages to his legacy.\u003cbr\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eAs horror and thrillers continue to dominate the box office, spawning ever more lucrative franchises, it’s worth tracing the roots of this enduring appeal. Alfred Hitchcock, the Master of Suspense, didn’t single-handedly invent the horror genre, but the influences he drew from and the techniques he pioneered during his career still cast a long shadow over modern audiences’ ever-growing thirst for thrills and chills.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eHITCH! The Original Cinema Influencer\u003c/strong\u003e will chart the progression of Hitchcock’s technique and influence chronologically, beginning with his early films made in England such as the silent film \u003ca href=\"https://www.paristheaternyc.com/film/blackmail-hitchcock\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003e\u003cstrong\u003eBlackmail\u003c/strong\u003e\u003c/i\u003e\u003c/a\u003e, as well as spy thriller \u003ca href=\"https://www.paristheaternyc.com/film/the-lady-vanishes-hitchcock\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003e\u003cstrong\u003eThe Lady Vanishes\u003c/strong\u003e\u003c/i\u003e\u003c/a\u003e. The latter was an early indicator of Hitchcock’s ability to take root in popular culture, as the performances of Basil Radford and Naunton Wayne as Charters and Caldicott proved so popular, the actors would go on to reprise their roles in five more films – including Carol Reed’s \u003ca href=\"https://www.paristheaternyc.com/film/the-lady-vanishes-night-train-to-munich-hitchcock\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003e\u003cstrong\u003eNight Train to Munich\u003c/strong\u003e\u003c/i\u003e\u003c/a\u003e, which will play in special \u003ca href=\"https://www.paristheaternyc.com/film/the-lady-vanishes-night-train-to-munich-hitchcock\" target=\"_blank\" rel=\"noopener noreferrer\"\u003edouble feature shows with \u003ci\u003eThe Lady Vanishes\u003c/i\u003e\u003c/a\u003e. We’ll also showcase films by some of the German expressionist masters, including \u003ca href=\"https://www.paristheaternyc.com/film/the-last-laugh-hitchcock\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eF.W. Murnau\u003c/a\u003e and \u003ca href=\"https://www.paristheaternyc.com/film/m-hitchcock\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eFritz Lang\u003c/a\u003e, whose work Hitchcock studied during his time in the German film industry. Their inventive approach to visual storytelling—relying less on title cards or excessive dialogue—became a guiding principle in Hitchcock’s own filmmaking.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003ch2\u003e\u003ca href=\"https://www.youtube.com/watch?v=138Ej0dlJ7k\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eClick here to watch the series trailer.\u003c/a\u003e\u003c/h2\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eHollywood would soon come calling for Hitchcock, pairing incredible star power with his increasingly virtuosic directorial style. This era would see him win his only Best Picture Oscar - for 1940’s \u003ca href=\"https://www.paristheaternyc.com/film/rebecca-hitchcock\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003e\u003cstrong\u003eRebecca\u003c/strong\u003e\u003c/i\u003e\u003c/a\u003e - and would be heavily influenced by World War II, seen clearly in spy thrillers like \u003ca href=\"https://www.paristheaternyc.com/film/foreign-correspondent-hitchcock\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003e\u003cstrong\u003eForeign Correspondent\u003c/strong\u003e\u003c/i\u003e\u003c/a\u003e, \u003ca href=\"https://www.paristheaternyc.com/film/saboteur-hitchcock\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003e\u003cstrong\u003eSaboteur\u003c/strong\u003e\u003c/i\u003e\u003c/a\u003e, and \u003ca href=\"https://www.paristheaternyc.com/film/lifeboat-hitchcock\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003e\u003cstrong\u003eLifeboat\u003c/strong\u003e\u003c/i\u003e\u003c/a\u003e, as well as two rarely-screened short films (\u003ca href=\"https://www.paristheaternyc.com/film/wartime-shorts-hitchcock\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003e\u003cstrong\u003eBon Voyage\u003c/strong\u003e\u003c/i\u003e and \u003ci\u003e\u003cstrong\u003eAventure Malgache\u003c/strong\u003e\u003c/i\u003e\u003c/a\u003e) made by Hitchcock to aid in the war effort, but shelved by government officials for being “inflammatory”.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eThe 1950s saw Hitchcock in peak form, with internationally beloved movie stars like Grace Kelly, James Stewart, Cary Grant, Ingrid Bergman, Montgomery Clift, and Marlene Dietrich all lining up to headline some of the director’s most universally praised classics – from the pulse-pounding thriller \u003ca href=\"https://www.paristheaternyc.com/film/rear-window-hitchcock\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003e\u003cstrong\u003eRear Window\u003c/strong\u003e\u003c/i\u003e\u003c/a\u003e, to the psychological labyrinth of \u003ca href=\"https://www.paristheaternyc.com/film/vertigo-hitchcock\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003e\u003cstrong\u003eVertigo\u003c/strong\u003e\u003c/i\u003e\u003c/a\u003e, which frequently polls as one the greatest films ever made. But despite acclaim and success, Hitchcock’s appetite for grit, experimentation and boundary-pushing never waned, well into the 1960s where he completely upended audience expectations and helped launched horror as the popular genre it is today with the legendary \u003ca href=\"https://www.paristheaternyc.com/film/psycho\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003e\u003cstrong\u003ePsycho\u003c/strong\u003e\u003c/i\u003e\u003c/a\u003e, and delivered a vision of apocalyptic doom with \u003ca href=\"https://www.paristheaternyc.com/film/the-birds-hitchcock\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003e\u003cstrong\u003eThe Birds\u003c/strong\u003e\u003c/i\u003e\u003c/a\u003e.\u003cbr\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eAs his career drew to a close, Hitchcock continued to deliver surprises— through the entertainingly vicious \u003ca href=\"https://www.paristheaternyc.com/film/frenzy-hitchcock\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003e\u003cstrong\u003eFrenzy\u003c/strong\u003e\u003c/i\u003e\u003c/a\u003e and the dark comedy of his final film, \u003ca href=\"https://www.paristheaternyc.com/film/family-plot-hitchcock\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003e\u003cstrong\u003eFamily Plot\u003c/strong\u003e\u003c/i\u003e\u003c/a\u003e. This period also saw a new generation of filmmakers producing work clearly indebted to the Master of Suspense—from the overt thrills of Truffaut’s \u003ca href=\"https://www.paristheaternyc.com/film/the-bride-wore-black-hitchcock\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003e\u003cstrong\u003eThe Bride Wore Black\u003c/strong\u003e\u003c/i\u003e\u003c/a\u003e to the affectionate parody of Mel Brooks’ \u003ca href=\"https://www.paristheaternyc.com/film/high-anxiety-hitchcock\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003e\u003cstrong\u003eHigh Anxiety\u003c/strong\u003e\u003c/i\u003e\u003c/a\u003e. Over two decades later, Robert Zemeckis offered his own Hitchcockian thriller with \u003ca href=\"https://www.paristheaternyc.com/film/what-lies-beneath-hitchcock\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003e\u003cstrong\u003eWhat Lies Beneath\u003c/strong\u003e\u003c/i\u003e\u003c/a\u003e—a tradition that continues to this day, as many of today’s horror auteurs trace their cinematic lineage back to Hitchcock.\u003cbr\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eThirty-five films in this series will have showings in 35mm, including Hitchcock classics like \u003ca href=\"https://www.paristheaternyc.com/film/rear-window-hitchcock\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003e\u003cstrong\u003eRear Window\u003c/strong\u003e\u003c/i\u003e\u003c/a\u003e\u003ci\u003e\u003cstrong\u003e, \u003c/strong\u003e\u003c/i\u003e\u003ca href=\"https://www.paristheaternyc.com/film/vertigo-hitchcock\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003e\u003cstrong\u003eVertigo\u003c/strong\u003e\u003c/i\u003e\u003c/a\u003e\u003ci\u003e\u003cstrong\u003e, \u003c/strong\u003e\u003c/i\u003e\u003ca href=\"https://www.paristheaternyc.com/film/north-by-northwest-hitchcock\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003e\u003cstrong\u003eNorth by Northwest\u003c/strong\u003e\u003c/i\u003e\u003c/a\u003e, and \u003ca href=\"https://www.paristheaternyc.com/film/the-lady-vanishes-hitchcock\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003e\u003cstrong\u003eThe Lady Vanishes\u003c/strong\u003e\u003c/i\u003e\u003c/a\u003e, as well as enduring masterpieces like Francois Truffaut’s \u003ca href=\"https://www.paristheaternyc.com/film/the-bride-wore-black-hitchcock\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003e\u003cstrong\u003eThe Bride Wore Black\u003c/strong\u003e\u003c/i\u003e\u003c/a\u003e, Fritz Lang’s \u003ca href=\"https://www.paristheaternyc.com/film/m-hitchcock\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003e\u003cstrong\u003eM\u003c/strong\u003e\u003c/i\u003e\u003c/a\u003e, and Henri-Georges Clouzot’s \u003ca href=\"https://www.paristheaternyc.com/film/diabolique-hitchcock\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003e\u003cstrong\u003eDiabolique\u003c/strong\u003e\u003c/i\u003e\u003c/a\u003e, screening on an imported 35mm print courtesy of Institut Français. We’ll also have special treats like two episodes of \u003ca href=\"https://www.paristheaternyc.com/film/alfred-hitchcock-presents-hitchcock\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003e\u003cstrong\u003eAlfred Hitchcock Presents\u003c/strong\u003e\u003c/i\u003e\u003c/a\u003e, featuring memorable small screen roles for stars like Steve McQueen and Peter Lorre and the directing prowess of multi-hypenate Ida Lupino. And those curious to learn more about the filmmaker’s history can take in two featured documentaries: Kent Jones’ \u003ca href=\"https://www.paristheaternyc.com/film/hitchcock-truffaut-hitchcock\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003e\u003cstrong\u003eHitchcock/Truffaut\u003c/strong\u003e\u003c/i\u003e\u003c/a\u003e, and \u003ca href=\"https://www.paristheaternyc.com/film/my-name-is-alfred-hitchcock\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003e\u003cstrong\u003eMy Name is Alfred Hitchcock\u003c/strong\u003e\u003c/i\u003e\u003c/a\u003e by Mark Cousins.\u003cbr\u003e\u003cbr\u003e\u003cstrong\u003e\u003cu\u003eSeries At-A-Glance Schedules:\u003c/u\u003e\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003ca href=\"https://cms.ntflxthtrs.com/uploads/Paris_Hitchcock_Series_Schedule_Poster_8_5_x_11_3a4cc6399b.pdf\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eBy Playdate \u0026amp; Time (Chronological)\u003c/a\u003e\u003c/li\u003e\u003cli\u003e\u003ca href=\"https://cms.ntflxthtrs.com/uploads/Paris_Hitchcock_Series_Alpha_Poster_8_5_x_11_87c4ec763a.pdf\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eBy Title (Alphabetical)\u003c/a\u003e\u003cbr\u003e\u0026nbsp;\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003e\u003cu\u003eFeaturing 35mm shows of:\u003c/u\u003e\u003c/strong\u003e\u003cbr\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003ca href=\"https://www.paristheaternyc.com/film/the-39-steps-hitchcock\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eThe 39 Steps\u003c/i\u003e\u003c/a\u003e\u003cbr\u003e\u003ca href=\"https://www.paristheaternyc.com/film/the-birds-hitchcock\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eThe Birds\u003c/i\u003e\u003c/a\u003e\u003cbr\u003e\u003ca href=\"https://www.paristheaternyc.com/film/blackmail-hitchcock\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eBlackmail\u003c/i\u003e\u003c/a\u003e\u003cbr\u003e\u003ca href=\"https://www.paristheaternyc.com/film/wartime-shorts-hitchcock\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eBon Voyage \u003c/i\u003eand\u003ci\u003e Aventure Malgache\u003c/i\u003e\u003c/a\u003e\u003cbr\u003e\u003ca href=\"https://www.paristheaternyc.com/film/dial-m-for-murder-hitchcock\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eDial M For Murder\u003c/i\u003e\u003c/a\u003e\u003cbr\u003e\u003ca href=\"https://www.paristheaternyc.com/film/family-plot-hitchcock\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eFamily Plot\u003c/i\u003e\u003c/a\u003e\u003cbr\u003e\u003ca href=\"https://www.paristheaternyc.com/film/frenzy-hitchcock\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eFrenzy\u003c/i\u003e\u003c/a\u003e\u003cbr\u003e\u003ca href=\"https://www.paristheaternyc.com/film/i-confess-hitchcock\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eI Confess\u003c/i\u003e\u003c/a\u003e\u003cbr\u003e\u003ca href=\"https://www.paristheaternyc.com/film/the-lady-vanishes-hitchcock\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eThe Lady Vanishes\u003c/i\u003e\u003c/a\u003e\u003cbr\u003e\u003ca href=\"https://www.paristheaternyc.com/film/the-man-who-knew-too-much-1956-hitchcock\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eThe Man Who Knew Too Much\u003c/i\u003e\u003c/a\u003e\u003ci\u003e \u003c/i\u003e(1956)\u003cbr\u003e\u003ca href=\"https://www.paristheaternyc.com/film/marnie-hitchcock\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eMarnie\u003c/i\u003e\u003c/a\u003e\u003cbr\u003e\u003ca href=\"https://www.paristheaternyc.com/film/mr-and-mrs-smith-hitchcock\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eMr. \u0026amp; Mrs. Smith\u003c/i\u003e\u003c/a\u003e\u003cbr\u003e\u003ca href=\"https://www.paristheaternyc.com/film/north-by-northwest-hitchcock\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eNorth By Northwest\u003c/i\u003e\u003c/a\u003e\u003cbr\u003e\u003ca href=\"https://www.paristheaternyc.com/film/rear-window-hitchcock\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eRear Window\u003c/i\u003e\u003c/a\u003e\u003cbr\u003e\u003ca href=\"https://www.paristheaternyc.com/film/rope-hitchcock\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eRope\u003c/i\u003e\u003c/a\u003e\u003cbr\u003e\u003ca href=\"https://www.paristheaternyc.com/film/sabotage-hitchcock\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eSabotage\u003c/i\u003e\u003c/a\u003e\u003cbr\u003e\u003ca href=\"https://www.paristheaternyc.com/film/saboteur-hitchcock\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eSaboteur\u003c/i\u003e\u003c/a\u003e\u003cbr\u003e\u003ca href=\"https://www.paristheaternyc.com/film/shadow-of-a-doubt-hitchcock\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eShadow of a Doubt\u003c/i\u003e\u003c/a\u003e\u003cbr\u003e\u003ca href=\"https://www.paristheaternyc.com/film/stage-fright-hitchcock\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eStage Fright\u003c/i\u003e\u003c/a\u003e\u003cbr\u003e\u003ca href=\"https://www.paristheaternyc.com/film/strangers-on-a-train-hitchcock\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eStrangers on a Train\u003c/i\u003e\u003c/a\u003e\u003cbr\u003e\u003ca href=\"https://www.paristheaternyc.com/film/suspicion-hitchcock\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eSuspicion\u003c/i\u003e\u003c/a\u003e\u003cbr\u003e\u003ca href=\"https://www.paristheaternyc.com/film/to-catch-a-thief-hitchcock\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eTo Catch a Thief\u003c/i\u003e\u003c/a\u003e\u003cbr\u003e\u003ca href=\"https://www.paristheaternyc.com/film/torn-curtain-hitchcock\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eTorn Curtain\u003c/i\u003e\u003c/a\u003e\u003cbr\u003e\u003ca href=\"https://www.paristheaternyc.com/film/the-trouble-with-harry-hitchcock\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eThe Trouble with Harry\u003c/i\u003e\u003c/a\u003e\u003cbr\u003e\u003ca href=\"https://www.paristheaternyc.com/film/vertigo-hitchcock\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eVertigo\u003c/i\u003e\u003c/a\u003e\u003cbr\u003e\u003ca href=\"https://www.paristheaternyc.com/film/young-and-innocent-hitchcock\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eYoung and Innocent\u003c/i\u003e\u003c/a\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003ca href=\"https://www.paristheaternyc.com/film/bad-education-hitchcock\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eBad Education\u003c/i\u003e\u003c/a\u003e\u003c/p\u003e\u003cp\u003e\u003ca href=\"https://www.paristheaternyc.com/film/the-bride-wore-black-hitchcock\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eThe Bride Wore Black\u003c/i\u003e\u003c/a\u003e\u003c/p\u003e\u003cp\u003e\u003ca href=\"https://www.paristheaternyc.com/film/cape-fear-hitchcock\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eCape Fear\u003c/i\u003e\u003c/a\u003e\u003cbr\u003e\u003ca href=\"https://www.paristheaternyc.com/film/diabolique-hitchcock\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eDiabolique\u003c/i\u003e\u003c/a\u003e\u003ci\u003e \u003c/i\u003e(courtesy of Institut Français)\u003c/p\u003e\u003cp\u003e\u003ca href=\"https://www.paristheaternyc.com/film/frantic-hitchcock\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eFrant  a collection of classic Hitchcock films will be \u003ca href=\"https://www.netflix.com/browse/genre/83073355\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eavailable to stream on Netflix\u003c/a\u003e in the US featuring some of his most iconic works starting June 1.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"3d:Tbb6,"])</script><script>self.__next_f.push([1,"\u003cp\u003eOn October 1, Netflix will release Zoe Kazan’s adaptation of John Steinbeck’s masterpiece \u003ci\u003e\u003cstrong\u003eEast of Eden\u003c/strong\u003e\u003c/i\u003e. The seven-episode series features a formidable cast led by Florence Pugh as the indelible antihero Cathy Ames, whose life is intertwined with the lives of generations of men from the Trask family (including Christopher Abbott as Adam and Mike Faist as Charles) as the characters live out the darker side of the California dream. The series arrives over 70 years after the 1955 film adaptation starring James Dean - directed by Elia Kazan, Zoe’s grandfather - focused solely on the book’s final section.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eThat family connection to the material, as well as her own abiding love for the novel, made adapting \u003ci\u003e\u003cstrong\u003eEast of Eden\u003c/strong\u003e\u003c/i\u003e a deeply personal and resonant experience for Zoe Kazan. To celebrate the captivating results of her work, the Paris Theater is proud to present \u003cstrong\u003eThe Monster in All of Us: The Films Behind \u003c/strong\u003e\u003ci\u003e\u003cstrong\u003eEast of Eden\u003c/strong\u003e\u003c/i\u003e, a week-long repertory film series curated in collaboration with Zoe Kazan showcasing films across cinema history that were key inspirations for Kazan throughout her creative process.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eKazan has always been drawn to the character of Cathy Ames – whose enigmatic nature and uncommon sense of agency fascinated her. Many of the films in this series provided inspiration to Kazan as she unfolded more of Cathy’s character out of Steinbeck’s text, including the complex women contained in the performances of Jane Fonda in \u003ci\u003e\u003cstrong\u003eKlute\u003c/strong\u003e\u003c/i\u003e, Barbara Stanwyck in \u003ci\u003e\u003cstrong\u003eStella Dallas\u003c/strong\u003e\u003c/i\u003e, or Scarlett Johansson in \u003ci\u003e\u003cstrong\u003eUnder the Skin\u003c/strong\u003e\u003c/i\u003e. Kazan even found guidance in something Steinbeck once wrote about Cathy in his reflections on writing the novel: “They will forget I said she was bad. And they will hate her because while she is a monster, she is a little piece of the monster in all of us.”\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eThe Monster in All of Us \u003c/strong\u003ewill include a special, free screening of \u003ci\u003e\u003cstrong\u003eEast of Eden\u003c/strong\u003e\u003c/i\u003e episodes 1, 2 \u0026amp; 3 at the Paris Theater, followed by a \u003cstrong\u003eQ\u0026amp;A with Zoe Kazan on Saturday, October 3\u003c/strong\u003e. Later that evening, Kazan will introduce a 35mm presentation of the 1955 film adaptation of \u003ci\u003e\u003cstrong\u003eEast of Eden\u003c/strong\u003e\u003c/i\u003e, directed by Elia Kazan and starring James Dean, Raymond Massey, and Jo Van Fleet in an Academy Award®-winning performance as Cathy.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eZoe Kazan will also give special in-person introductions\u003c/strong\u003e to a 35mm presentation of \u003ci\u003e\u003cstrong\u003eKlute\u003c/strong\u003e\u003c/i\u003e on \u003cstrong\u003eFriday, October 2 at 6:45 PM\u003c/strong\u003e and to Alfred Hitchcock’s \u003ci\u003e\u003cstrong\u003eNotorious\u003c/strong\u003e\u003c/i\u003e on \u003cstrong\u003eSunday, October 4 at 5:45 PM\u003c/strong\u003e.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eSelect screenings will feature pre-recorded introductions from Zoe Kazan, discussing how each film influenced her work on the series.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"3e:T673,\u003cp\u003e\u003ci\u003e\u003cstrong\u003eSneak Preview Screening on Thursday, October 15 \u003c/strong\u003e\u003c/i\u003e\u003cstrong\u003e| \u003c/strong\u003e\u003ci\u003e\u003cstrong\u003eQ\u0026amp;A with filmmakers Javier Calvo and Javier Ambrossi\u003c/strong\u003e\u003c/i\u003e\u003cbr\u003e\u003cbr\u003e\u003ci\u003e\u003cstrong\u003eExtended introduction by cast member Julio Torres (\u003c/strong\u003e\u003c/i\u003e\u003cstrong\u003eProblemista, Los Espookys\u003c/strong\u003e\u003ci\u003e\u003cstrong\u003e) at the 6:15pm screenings on Friday, October 16 and Saturday, October 17\u003c/strong\u003e\u003c/i\u003e\u003cbr\u003e\u003cbr\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003ci\u003eWINNER - People's Choice Award \u003c/i\u003e| \u003ci\u003eToronto International Film Festival\u003c/i\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003ci\u003eWINNER - Audience Award \u003c/i\u003e|\u003ci\u003e San Sebastian Film Festival\u003c/i\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003ci\u003eWINNER - Best Director, Javier Calvo and Javier Ambrossi \u003c/i\u003e| \u003ci\u003eCannes Film Festival\u003c/i\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003ci\u003eSpain’s Official Selection for International Feature Film at the 99th Academy Awards®\u003c/i\u003e\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003ci\u003e\u003cstrong\u003e35mm print! La Bola Negra\u003c/strong\u003e\u003c/i\u003e is a bold, passionate triptych spanning nearly a century of Spanish history from the 30s to modern day. The film tells the story of three men whose lives are intimately connected through desire, pain, and inheritance.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u0 office 30 minutes prior to showtime (advance reservations not available).\u003c/strong\u003e\u003c/p\u003e42:T4546,"])</script><script>self.__next_f.push([1,"\u003cp\u003eValentine's Day may only happen once a year, but why spend only one day celebrating when there's so much love to give?\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eThe Paris Theater is thrilled to announce\u0026nbsp;\u003ci\u003e\u003cstrong\u003eA Century of Romance: Star-Crossed, On the Run, and Happily Ever After\u003c/strong\u003e\u003c/i\u003e, a four-week series kicking off on Valentine’s Day weekend, picking up again Wednesday, March 5 and extending through April 29. Featuring a treasure trove of beautiful 35mm prints, special in-person guest appearances, and some of your favorite love stories in dazzling 4K, this series will bring you films from across one hundred years of cinema history that explore love, romance, heartbreak, and longing in a myriad of genres, tones, and time periods. Whether you’re looking to lose yourself in passionate affairs from bygone eras, young first loves, or volatile relationships that seemed destined for tragedy,\u0026nbsp;\u003ci\u003eA Century of Romance\u003c/i\u003e will pull on your heartstrings in more ways than one, collecting dozens of great love stories into four categories:\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003cbr\u003e\u0026nbsp;\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003ci\u003eSilents \u0026amp; Screwballs\u003c/i\u003e, starting March 5\u003c/li\u003e\u003cli\u003e\u003ci\u003eAn Unlikely Pair\u003c/i\u003e, starting March 21\u003c/li\u003e\u003cli\u003e\u003ci\u003eLovers Abroad and Against the Odds\u003c/i\u003e, starting April 4\u003c/li\u003e\u003cli\u003e\u003ci\u003eAll’s Fair in Love and Boors: Lubitsch \u0026amp; Sturges\u003c/i\u003e, starting April 11\u0026nbsp;\u0026nbsp;\u003cbr\u003e\u0026nbsp;\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eA special guest joining us during this series will be\u0026nbsp;\u003cstrong\u003eMatthew Modine\u003c/strong\u003e, who celebrates the 40th anniversary of\u0026nbsp;\u003ca href=\"https://www.paristheaternyc.com/film/vision-quest-romance\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003e\u003cstrong\u003eVision Quest\u003c/strong\u003e\u003c/i\u003e\u003c/a\u003e\u003cstrong\u003e\u0026nbsp;\u003c/strong\u003eat the Paris on Thursday, March 13. The film will screen from an archival 35mm print courtesy of Warner Bros.\u0026nbsp;\u0026nbsp;\u003cbr\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003ci\u003e\u003cstrong\u003eA Century of Romance\u003c/strong\u003e\u003c/i\u003e features 54 films, including 28 on 35mm. Film lovers of any age are guaranteed to find a new favorite amidst this abundant celebration of screwball comedy, tear-jerking drama, period costumes, and modern heartache….all in the name of love!\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003cbr\u003e\u0026nbsp;\u003c/p\u003e\u003ch3\u003e\u003cstrong\u003e\u003cu\u003eHighlights of the Series include:\u003c/u\u003e\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003e\u003cbr\u003e\u003cstrong\u003eUPCOMING IN-PERSON APPEARANCES:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cstrong\u003eWednesday, April 2:\u0026nbsp;\u003c/strong\u003e 4K Restoration of \u003ca href=\"https://www.paristheaternyc.com/film/maurice-romance\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eMaurice\u003c/i\u003e\u003c/a\u003e\u003ci\u003e, \u003c/i\u003efollowed by a Q\u0026amp;A with director James Ivory, moderated by Ira Sachs (\u003ci\u003ePassages\u003c/i\u003e).\u0026nbsp;\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eMonday, April 14: \u003c/strong\u003eDouble feature of \u003ca href=\"https://www.paristheaternyc.com/film/sullivans-travels-to-be-or-not-to-be-romance\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eSullivan's Travels + To Be or Not to Be\u003c/i\u003e\u003c/a\u003e\u003ci\u003e \u003c/i\u003eintroduced by Annette Insdorf, Columbia University Film Professor.\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003cstrong\u003e\u003cu\u003eWORLD PREMIERE OF 4K RESTORATION\u003c/u\u003e:\u003c/strong\u003e\u0026nbsp;\u003ca href=\"https://www.paristheaternyc.com/film/out-of-africa-romance\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003e\u003cstrong\u003eOut of Africa\u003c/strong\u003e\u003c/i\u003e\u003c/a\u003e\u003c/p\u003e\u003cp\u003eCelebrating its 40th Anniversary this year, seven-time Academy Award-winning\u0026nbsp;\u003ca href=\"https://www.paristheaternyc.com/film/out-of-africa-romance\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eOut of Africa\u003c/i\u003e\u003c/a\u003e, directed by Sydney Pollack and starring Meryl Streep and Robert Redford, makes its 4K Restoration debut at the Paris.\u003ci\u003e\u0026nbsp;\u003c/i\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003cstrong\u003e\u003cu\u003eARCHIVAL 35MM PRINTS:\u003c/u\u003e\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003ca href=\"https://www.paristheaternyc.com/film/letter-from-an-unknown-woman-romance\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eLetter from an Unknown Woman\u003c/i\u003e\u003c/a\u003e, courtesy of the UCLA Film \u0026amp; Television Archive\u003c/p\u003e\u003cp\u003e\u003ca href=\"https://www.paristheaternyc.com/film/morocco-romance\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eMorocco\u003c/i\u003e\u003c/a\u003e\u003ci\u003e,\u003c/i\u003e preserved by the Library of Congress\u003c/p\u003e\u003cp\u003e\u003ca href=\"https://www.paristheaternyc.com/film/my-favorite-wife-romance\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eMy Favorite Wife\u003c/i\u003e\u003c/a\u003e\u003ci\u003e,\u003c/i\u003e preserved by the Library of Congress\u003c/p\u003e\u003cp\u003e\u003ca href=\"https://www.paristheaternyc.com/film/shop-around-the-corner-hail-romance\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eThe Shop Around the Corner\u003c/i\u003e\u003c/a\u003e\u003ci\u003e,\u003c/i\u003e from the Collection of the Library of Congress\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003ch3\u003e\u003cstrong\u003e\u003cu\u003eA Century of Romance in Four Weeks:\u003c/u\u003e\u003c/strong\u003e\u0026nbsp;\u0026nbsp;\u003cbr\u003e\u003cbr\u003e\u003cstrong\u003eSilents \u0026amp; Screwballs, starting March 5\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003eFrom the early days of Hollywood, romance was writ large onscreen by the silent clowns like Chaplin and Keaton, as well as captivating silent dramas. When sound took over, the rapid fire dialogue and farcical plots of the great screwball comedies took over, whose inspiration stretched onward through the decades.\u0026nbsp; Films this week include:\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003ca href=\"https://www.paristheaternyc.com/film/adams-rib-romance\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eAdam’s Rib\u003c/i\u003e\u003c/a\u003e\u003ci\u003e\u0026nbsp;\u003c/i\u003e(35mm) |\u003cspan style=\"background-color:transparent;color:#000000;\"\u003e \u003c/span\u003e\u003ca href=\"https://www.paristheaternyc.com/film/born-yesterday-romance\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eBorn Yesterday\u003c/i\u003e \u003c/a\u003e|\u003cspan style=\"background-color:transparent;color:#000000;\"\u003e \u003c/span\u003e\u003ca href=\"https://www.paristheaternyc.com/film/bringing-up-baby-romance\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eBringing Up Baby\u003c/i\u003e\u003c/a\u003e |\u003cspan style=\"background-color:transparent;color:#000000;\"\u003e \u003c/span\u003e\u003ca href=\"https://www.paristheaternyc.com/film/city-lights-romance\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eCity Lights\u003c/i\u003e\u003c/a\u003e (35mm) |\u003cspan style=\"background-color:transparent;color:#00 in Man\u003c/i\u003e\u003c/a\u003e (35mm) |\u003cspan style=\"background-color:transparent;color:#000000;\"\u003e \u003c/span\u003e\u003ca href=\"https://www.paristheaternyc.com/film/whats-up-doc-romance\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eWhat’s Up, Doc?\u003c/i\u003e\u003c/a\u003e (35mm) |\u003cspan style=\"background-color:transparent;color:#000000;\"\u003e \u003c/span\u003e\u003ca href=\"https://www.paristheaternyc.com/film/you-cant-take-it-with-you-romance\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eYou Can’t Take It With You\u003c/i\u003e\u003c/a\u003e\u003c/p\u003e\u003ch3\u003e\u003cbr\u003e\u003cstrong\u003eAn Unlikely Pair, starting March 21\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003e“They’ll never end up together!” ….or will they? Some of the greatest cinematic romances involve couples long kept apart by issues of class, race, or their seemingly totally incompatible personalities. Discover the joy of watching the unlikely become inevitable in these films:\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003ca href=\"https://www.paristheaternyc.com/film/amelie-valentines-day\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eAmélie\u003c/i\u003e\u003c/a\u003e |\u003cspan style=\"background-color:transparent;color:#000000;\"\u003e \u003c/span\u003e\u003ca href=\"https://www.paristheaternyc.com/film/but-im-a-cheerleader-romance\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eBut I’m a Cheerleader\u003c/i\u003e\u003c/a\u003e (4K Restoration DCP) |\u003cspan style=\"background-color:transparent;color:#000000;\"\u003e \u003c/span\u003e\u003ca href=\"https://www.paristheaternyc.com/film/claudine-romance\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eClaudine\u003c/i\u003e\u003c/a\u003e (4K DCP) | \u003ca href=\"https://www.paristheaternyc.com/film/harold-and-maude-romance\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eHarold and Maude\u003c/i\u0 :transparent;color:#000000;\"\u003e \u003c/span\u003e\u003ca href=\"https://www.paristheaternyc.com/film/out-of-africa-romance\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eOut of Africa\u003c/i\u003e\u003c/a\u003e (4K Restoration World Premiere) |\u003cspan style=\"background-color:transparent;color:#000000;\"\u003e \u003c/span\u003e\u003ca href=\"https://www.paristheaternyc.com/film/a-place-in-the-sun-romance\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eA Place in the Sun\u003c/i\u003e\u003c/a\u003e\u003cspan style=\"background-color:transparent;color:#000000;\"\u003e\u003ci\u003e \u003c/i\u003e| \u003c/span\u003e\u003ca href=\"https://www.paristheaternyc.com/film/summertime-romance\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eSummertime\u003c/i\u003e\u003c/a\u003e (35mm) |\u003cspan style=\"background-color:transparent;color:#000000;\"\u003e \u003c/span\u003e\u003ca href=\"https://www.paristheaternyc.com/film/they-live-by-night-romance\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eThey Live By Night\u003c/i\u003e\u003c/a\u003e (35mm)\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003ch3\u003e\u003cstrong\u003eAll’s Fair in Love and Boors: Lubitsch \u0026amp; Sturges, starting April 11\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003e\u003ci\u003eA Century of Romance\u003c/i\u003e’s final week will bring you a fantastic collection of double-features that pair enduring classics from two of Hollywood’s most celebrated filmmakers - Ernst Lubitsch and Preston Sturges - in a series we’re calling\u0026nbsp;\u003ci\u003e\u003cstrong\u003eAll’s Fair in Love and Boors\u003c/strong\u003e\u003c/i\u003e, a fitting title for two filmographies that frequently depicted tug-of-war romances with haughty men and clever women battling for the upper hand. During this final week, we’ll also show 1935’s\u0026nbsp;\u003ca href=\"https://www.paristheaternyc.com/film/the-good-fairy-romance\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003e\u003cstrong\u003eThe Good Fairy\u003c/strong\u003e\u003c/i\u003e\u003c/a\u003e, an under-appreciated discovery that feels like it could have been a collaboration by the two auteurs, on 35mm. Years before he became a director, screenwriter Sturges adapted this contemporary Hungarian play, replete with a cast of Lubitsch veterans: Margaret Sullivan, Herbert Marshall and Frank Morgan. But the script’s dazzling comedic wordplay is pure Sturges, and - on first viewing - you’ll find yourself wondering if this is Lubitsch adapting Sturges or Sturges channeling Lubitsch! (The film was, in fact, directed by William Wyler.)\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003ca href=\"https://www.paristheaternyc.com/film/shop-around-the-corner-hail-romance\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eThe Shop Around the Corner\u003c/i\u003e (35mm, part of the Collection of the Library of Congress) \u0026amp;\u0026nbsp;\u003ci\u003eHail the Conquering Hero\u0026nbsp;\u003c/i\u003e(35mm)\u003c/a\u003e\u003c/li\u003e\u003cli\u003e\u003ca href=\"https://www.paristheaternyc.com/film/sullivans-travels-to-be-or-not-to-be-romance\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eSullivan’s Travels\u0026nbsp;\u003c/i\u003e(35mm) \u0026amp;\u0026nbsp;\u003ci\u003eTo Be Or Not To Be\u003c/i\u003e\u003c/a\u003e\u003c/li\u003e\u003cli\u003e\u003ca href=\"https://www.paristheaternyc.com/film/ninotchka-palm-beach-story-romance\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eNinotchka\u0026nbsp;(35mm) \u0026amp;\u0026nbsp;The Palm Beach Story (35mm)\u003c/i\u003e\u003c/a\u003e\u003c/li\u003e\u003cli\u003e\u003ca href=\"https://www.paristheaternyc.com/film/trouble-in-paradise-lady-eve-romance\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eTrouble in Paradise\u003c/i\u003e (35mm) \u0026amp;\u0026nbsp;\u003ci\u003eThe Lady Eve\u003c/i\u003 ator, writer, producer and narrator of\u0026nbsp;\u003ca href=\"https://www.youmustrememberthispodcast.com/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003e\u003cstrong\u003eYou Must Remember This\u003c/strong\u003e\u003c/i\u003e\u003c/a\u003e,\u0026nbsp;the podcast dedicated to exploring the secret and/or forgotten histories of Hollywood's first century. Longworth will join us for two screenings in celebration of her podcast’s new season called \"The Bisexuals”, debuting September 15.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eSpanning eight episodes with\u0026nbsp;a cast of characters including Elizabeth Taylor, Montgomery Clift, Josephine Baker, Tallulah Bankhead, Billie Holiday, Jane and Paul Bowles, Nicholas Ray\u0026nbsp;and more, \"The Bisexuals\" will explore the story of Libby Holman, the sultry singer who became a Broadway sensation in the late 1920s and 30s, led a sexually fluid social life, and was embroiled in scandal when she was indicted for the murder of her husband, the heir to the R.J. Reynolds tobacco fortune.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eThis series features two screenings starring Montgomery Clift, one of the key players in Holman’s social circle:\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cul\u003e\u003cli\u003eOn Saturday, October 31 at 12:00 PM, Karina Longworth will give an extended introduction to an archival 35mm print of George Stevens’ A Place in the Sun (1951), starring Clift, Elizabeth Taylor and Shelley Winters. The film garnered nine Academy Award nominations, winning six including Best Director for Stevens. \u003cstrong\u003e35mm archival print from the Collection of the Library of Congress.\u003c/strong\u003e\u003cbr\u003e\u0026nbsp;\u003c/li\u003e\u003cli\u003eOn Sunday, November 1 at 6:15 PM, Karina Longworth will give an extended introduction to an archival 35mm print of Elia Kazan’s Wild River (1960), starring Clift, Lee Remick and Jo Van Fleet. \u003cstrong\u003e35mm archival print courtesy of the George Eastman Museum, lent by an anonymous collector.\u003c/strong\u003e\u003c/li\u003e\u003c/ul\u003e44:T798,\u003cp\u003eThis Fall, the Paris Theater is thrilled to welcome\u0026nbsp;\u003cstrong\u003eKarina Longworth\u003c/st"])</script><script>self.__next_f.push([1,"rong\u003e, the creator, writer, producer and narrator of\u0026nbsp;\u003ca href=\"https://www.youmustrememberthispodcast.com/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003e\u003cstrong\u003eYou Must Remember This\u003c/strong\u003e\u003c/i\u003e\u003c/a\u003e,\u0026nbsp;the podcast dedicated to exploring the secret and/or forgotten histories of Hollywood's first century. Longworth will join us for two screenings in celebration of her podcast’s new season called \"The Bisexuals”, debuting September 15.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eSpanning eight episodes with\u0026nbsp;a cast of characters including Elizabeth Taylor, Montgomery Clift, Josephine Baker, Tallulah Bankhead, Billie Holiday, Jane and Paul Bowles, Nicholas Ray\u0026nbsp;and more, \"The Bisexuals\" will explore the story of Libby Holman, the sultry singer who became a Broadway sensation in the late 1920s and 30s, led a sexually fluid social life, and was embroiled in scandal when she was indicted for the murder of her husband, the heir to the R.J. Reynolds tobacco fortune.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eThis series features two screenings starring Montgomery Clift, one of the key players in Holman’s social circle:\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cul\u003e\u003cli\u003eOn Saturday, October 31 at 12:00 PM, Karina Longworth will give an extended introduction to an archival 35mm print of George Stevens’ A Place in the Sun (1951), starring Clift, Elizabeth Taylor and Shelley Winters. The film garnered nine Academy Award nominations, winning six including Best Director for Stevens. \u003cstrong\u003e35mm archival print from the Collection of the Library of Congress.\u003c/strong\u003e\u003cbr\u003e\u0026nbsp;\u003c/li\u003e\u003cli\u003eOn Sunday, November 1 at 6:15 PM, Karina Longworth will give an extended introduction to an archival 35mm print of Elia Kazan’s Wild River (1960), starring Clift, Lee Remick and Jo Van Fleet. \u003cstrong\u003e35mm archival print courtesy of the George Eastman Museum, lent by an anonymous collector.\u003c/strong\u003e\u003c/li\u003e\u003c/ul\u003e45:T4b8,\u003cp\u003e\u003ci\u003eSouth Korea's official selection for International Feature Film at the 99th Academy Awards®\u003c/i\u003e\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003ci\u003eWinner - Silver Lion, Grand Jury Prize, Venice Film Festiva"])</script><script>self.__next_f.push([1,"l\u003c/i\u003e\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003ci\u003e\u003cstrong\u003e35mm print! \u003c/strong\u003e\u003c/i\u003eA story of two married couples — a laid-off worker and his spouse and a documentary filmmaker and her spouse — crossing paths to film a documentary and facing their different lives and hidden desires.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003ci\u003ePreceded by the US Premiere of\u003c/i\u003e\u003cbr\u003e\u003cbr\u003e\u003ci\u003e\u003cstrong\u003eHeartbeat \u003c/strong\u003e\u003c/i\u003e(2022, DCP, 28 min., produced by Qiao Cui)\u003cbr\u003eCaught up in anxiety, eight-year-old Chul in school tells his teacher that he is going to the bathroom, but runs straight home.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eWe are pleased to invite \u003c/strong\u003e\u003ci\u003e\u003cstrong\u003eAMPAS, SAG NOM COMM, BAFTA, PGA, DGA, WGA, ACE, ADG, ASC, CAS, CDG, CSA, MPEG, MPSE, SCL, VES\u003c/strong\u003e\u003c/i\u003e\u003cstrong\u003e Guild Members: Members and a guest are allowed complimentary entry to any public screening of new release titles on a space-available basis, upon presentation of your membership card at the venue box office 30 minutes prior to showtime (advance reservations not available).\u003c/strong\u003e\u003c/p\u003e46:Ta7a,"])</script><script>self.__next_f.push([1,"\u003cp\u003e\u003ci\u003e\u003cstrong\u003ePossible Love\u003c/strong\u003e\u003c/i\u003e, the first feature film in eight years from internationally acclaimed auteur\u0026nbsp;\u003cstrong\u003eLee Chang-dong\u003c/strong\u003e, will release in select theaters on October 23, and stream only on Netflix starting November 6. The film, which held its World Premiere at this year’s Venice Film Festival and won the Silver Lion Grand Jury Prize, follows the intertwined relationship of two married couples facing different paths and hidden desires.\u0026nbsp;\u003cbr\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eTo celebrate the release of Director Lee’s latest triumph, The Paris Theater is proud to announce\u0026nbsp;\u003cstrong\u003eFreedom and Desire: The Films of Lee Chang-dong\u003c/strong\u003e, the first retrospective of Director Lee’s in New York City to feature all eight of his films as director, including the U.S. premiere of the 2022 short film,\u0026nbsp;\u003ci\u003e\u003cstrong\u003eHeartbeat\u003c/strong\u003e\u003c/i\u003e\u003cstrong\u003e.\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eWhen discussing his latest film, Director Lee notes how\u0026nbsp;\u003ci\u003ePossible Love\u003c/i\u003e reflects his belief that no matter the pain, struggle, frustration and despair we face in life, what allows us to overcome these obstacles is our desire for freedom. This powerful notion echoes throughout his filmography, with characters constantly pursuing more than what their circumstances in life have given them –\u0026nbsp; from his first feature\u0026nbsp;\u003ci\u003e\u003cstrong\u003eGreen Fish\u003c/strong\u003e\u003c/i\u003e (1997) through his collection of award-winning masterpieces – including\u0026nbsp;\u003ci\u003e\u003cstrong\u003eOasis\u003c/strong\u003e\u003c/i\u003e (2002, Best Director at Venice FIlm Festival),\u0026nbsp;\u003ci\u003e\u003cstrong\u003eSecret Sunshine\u003c/strong\u003e\u003c/i\u003e (2007, Best Actress at Cannes Film Festival),\u0026nbsp;\u003ci\u003e\u003cstrong\u003ePoetry\u0026nbsp;\u003c/strong\u003e\u003c/i\u003e(2010, Best Screenplay at Cannes Film Festival), and\u0026nbsp;\u003ci\u003e\u003cstrong\u003eBurning\u003c/strong\u003e\u003c/i\u003e (2018, Cannes FIPRESCI Prize). Don’t miss the chance to experience all of these journeys at the Paris!\u0026nbsp;\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eThe series kicks off on Saturday, September 26 with 1999’s\u0026nbsp;\u003ci\u003e\u003cstrong\u003ePeppermint Candy\u003c/strong\u003e\u003c/i\u003e, followed by a Q\u0026amp;A with\u0026nbsp;\u003cstrong\u003eLee Chang-dong\u003c/strong\u003e and his longtime collaborator, actor\u0026nbsp;\u003cstrong\u003eSul Kyung-gu\u003c/strong\u003e (who also stars in\u0026nbsp;\u003ci\u003ePossible Love\u003c/i\u003e).\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eWe’ll close the series on November 24 with\u0026nbsp;\u003ci\u003e\u003cstrong\u003ePossible Love\u0026nbsp;\u003c/strong\u003e\u003c/i\u003e\u003cstrong\u003eon 35mm\u003c/strong\u003e, preceded by the U.S. premiere of Director Lee’s 2022 short film\u0026nbsp;\u003ci\u003e\u003cstrong\u003eHeartbeat\u003c/strong\u003e\u003c/i\u003e\u003cstrong\u003e.\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003ci\u003e\u003cstrong\u003ePossible Love\u003c/strong\u003e\u003c/i\u003e\u003cstrong\u003e opens in select theaters on October 23, including Film at Lincoln Center and Angelika Film Center in New York City. It streams only on Netflix starting November 6.\u003c/strong\u003e\u003c/p\u003e"])</script><script>self.__next_f.push([1,"9:[\"$\",\"$L35\",
