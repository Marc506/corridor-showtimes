003ci\u003e\u003cstrong\u003ePossible Love\u003c/strong\u003e\u003c/i\u003e, the first feature film in eight years from internationally acclaimed auteur\u0026nbsp;\u003cstrong\u003eLee Chang-dong\u003c/strong\u003e, will release in select theaters on October 23, and stream only on Netflix starting November 6. The film, which held its World Premiere at this year’s Venice Film Festival and won the Silver Lion Grand Jury Prize, follows the intertwined relationship of two married couples facing different paths and hidden desires.\u0026nbsp;\u003cbr\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eTo celebrate the release of Director Lee’s latest triumph, The Paris Theater is proud to announce\u0026nbsp;\u003cstrong\u003eFreedom and Desire: The Films of Lee Chang-dong\u003c/strong\u003e, the first retrospective of Director Lee’s in New York City to feature all eight of his films as director, including the U.S. premiere of the 2022 short film,\u0026nbsp;\u003ci\u003e\u003cstrong\u003eHeartbeat\u003c/strong\u003e\u003c/i\u003e\u003cstrong\u003e.\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eWhen discussing his latest film, Director Lee notes how\u0026nbsp;\u003ci\u003ePossible Love\u003c/i\u003e reflects his belief that no matter the pain, struggle, frustration and despair we face in life, what allows us to overcome these obstacles is our desire for freedom. This powerful notion echoes throughout his filmography, with characters constantly pursuing more than what their circumstances in life have given them –\u0026nbsp; from his first feature\u0026nbsp;\u003ci\u003e\u003cstrong\u003eGreen Fish\u003c/strong\u003e\u003c/i\u003e (1997) through his collection of award-winning masterpieces – including\u0026nbsp;\u003ci\u003e\u003cstrong\u003eOasis\u003c/strong\u003e\u003c/i\u003e (2002, Best Director at Venice FIlm Festival),\u0026nbsp;\u003ci\u003e\u003cstrong\u003eSecret Sunshine\u003c/strong\u003e\u003c/i\u003e (2007, Best Actress at Cannes Film Festival),\u0026nbsp;\u003ci\u003e\u003cstrong\u003ePoetry\u0026nbsp;\u003c/strong\u003e\u003c/i\u003e(2010, Best Screenplay at Cannes Film Festival), and\u0026nbsp;\u003ci\u003e\u003cstrong\u003eBurning\u003c/strong\u003e\u003c/i\u003e (2018, Cannes FIPRESCI Prize). Don’t miss the chance to experience all of these journeys at the Paris!\u0026nbsp;\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eThe series kicks off on Saturday, September 26 with 1999’s\u0026nbsp;\u003ci\u003e\u003cstrong\u003ePeppermint Candy\u003c/strong\u003e\u003c/i\u003e, followed by a Q\u0026amp;A with\u0026nbsp;\u003cstrong\u003eLee Chang-dong\u003c/strong\u003e and his longtime collaborator, actor\u0026nbsp;\u003cstrong\u003eSul Kyung-gu\u003c/strong\u003e (who also stars in\u0026nbsp;\u003ci\u003ePossible Love\u003c/i\u003e).\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eWe’ll close the series on November 24 with\u0026nbsp;\u003ci\u003e\u003cstrong\u003ePossible Love\u0026nbsp;\u003c/strong\u003e\u003c/i\u003e\u003cstrong\u003eon 35mm\u003c/strong\u003e, preceded by the U.S. premiere of Director Lee’s 2022 short film\u0026nbsp;\u003ci\u003e\u003cstrong\u003eHeartbeat\u003c/strong\u003e\u003c/i\u003e\u003cstrong\u003e.\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003ci\u003e\u003cstrong\u003ePossible Love\u003c/strong\u003e\u003c/i\u003e\u003cstrong\u003e opens in select theaters on October 23, including Film at Lincoln Center and Angelika Film Center in New York City. It streams only on Netflix starting November 6.\u003c/strong\u003e\u003c/p\u003e"])</script><script>self.__next_f.push([1,"17:T1866,"])</script><script>self.__next_f.push([1,"\u003cp\u003eThe Paris Theater is proud to present our full lineup for the fourth annual\u0026nbsp;\u003cstrong\u003eBig \u0026amp; Loud\u003c/strong\u003e, our flagship repertory series which has now been extended to five-and-a-half weeks of cinema's most unforgettable sensory experiences.\u0026nbsp;\u0026nbsp;\u003cbr\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eEach summer, New Yorkers look to The Paris Theater, the city’s last remaining single-screen movie palace, for the theater’s ability to deliver state-of-the-art, immersive moviegoing experiences, with each uniquely theatrical presentation reveling either in the legendary visual power of 70mm, the all-encompassing aural design enabled by Dolby Atmos, or stories supercharged by sound design.\u0026nbsp;\u0026nbsp;\u003cbr\u003e\u003cbr\u003e\u003cstrong\u003eWe’re halfway into Big \u0026amp; Loud, and the response has been thunderous. Sold-out crowds for rare 70mm prints, Dolby Atmos soundtracks rattling the walls of the Paris, and even a special live musical performance from Bill Frisell!\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eWe want to keep the party going, so The Paris Theater is happy to announce two special encore weeks of Big \u0026amp; Loud, extending through September 29!\u0026nbsp;\u003cbr\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eSome of our most popular titles will have new screenings added, including 70mm shows of\u0026nbsp;\u003ci\u003eLawrence of Arabia\u003c/i\u003e,\u0026nbsp;\u003ci\u003e2001: A Space Odyssey\u003c/i\u003e,\u0026nbsp;\u003ci\u003eWest Side Story\u003c/i\u003e,\u0026nbsp;\u003ci\u003eThe Sound of Music\u003c/i\u003e,\u0026nbsp;\u003ci\u003eBoogie Nights\u003c/i\u003e,\u0026nbsp;\u003ci\u003eBabylon\u003c/i\u003e, and\u0026nbsp;\u003ci\u003eThe Master\u003c/i\u003e. We’re also bringing back shows of best-sellers like Michael Mann’s\u0026nbsp;\u003ci\u003eHeat\u003c/i\u003e, Bob Fosse’s\u0026nbsp;\u003ci\u003eAll That Jazz\u003c/i\u003e, and Ridley Scott’s\u0026nbsp;\u003ci\u003eBlade Runner: The Final Cut\u003c/i\u003e in Dolby Atmos.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eAnd as a special treat, we’re adding a few new films to the mix:\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cul\u003e\u003cli\u003eThe 4K Restoration of Stanley Kubrick’s\u0026nbsp;\u003ci\u003eBarry Lyndon\u003c/i\u003e\u003c/li\u003e\u003cli\u003eA 35mm screening of Terrence Malick’s\u0026nbsp;\u003ci\u003eThe Tree of Life\u003c/i\u003e\u003c/li\u003e\u003cli\u003eA 35mm screening of David Lean’s\u0026nbsp;\u003ci\u003eThe Bridge on the River Kwai\u003c/i\u003e\u003c/li\u003e\u003cli\u003eEdgar Wright’s\u0026nbsp;\u003ci\u003eScott Pilgrim vs. the World\u0026nbsp;\u003c/i\u003ein Dolby Atmos\u0026nbsp;\u003cbr\u003e\u0026nbsp;\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003ca href=\"https://netflixstrapicentralcms.blob.core.windows.net/uploads/BL_26_Flyer9_8_9_29_V2_140126ca60.pdf\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003cstrong\u003eClick here for the series schedule.\u003c/strong\u003e\u003c/a\u003e\u0026nbsp;\u003cbr\u003e\u0026nbsp;\u0026nbsp;\u003cbr\u003e\u003cbr\u003eThis year's series has been jam-packed with one-of-a-kind cinematic thrills, including:\u0026nbsp;\u0026nbsp;\u003cbr\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e70mm Highlights\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eThe Big \u0026amp; Loud debuts of 70mm prints of\u0026nbsp;\u003ci\u003e\u003cstrong\u003eWest Side Story\u003c/strong\u003e\u003c/i\u003e\u003cstrong\u003e,\u0026nbsp;\u003c/strong\u003e\u003ci\u003e\u003cstrong\u003eAliens\u003c/strong\u003e\u003c/i\u003e\u003cstrong\u003e,\u0026nbsp;\u003c/strong\u003e\u003ci\u003e\u003cstrong\u003eThe Sound of Music, Batman, Inherent Vice, The Master, Babylon,\u0026nbsp;\u003c/strong\u003e\u003c/i\u003eand\u003ci\u003e\u003cstrong\u003e Kill Bill: The Whole Bloody Affair\u003c/strong\u003e\u003c/i\u003e\u003c/li\u003e\u003cli\u003eThe first ever 70mm screening in New York City of Francis Ford Coppola’s\u0026nbsp;\u003ci\u003e\u003cstrong\u003eOne from the Heart\u0026nbsp;\u003c/strong\u003e\u003c/i\u003e(1981)\u003c/li\u003e\u003cli\u003eThe first NYC 70mm screenings in over 40 years of\u0026nbsp;\u003ci\u003e\u003cstrong\u003eThe Razor’s Edge \u003c/strong\u003e\u003c/i\u003e(1984) starring Bill Murray and\u0026nbsp;\u003ci\u003e\u003cstrong\u003eWhite Nights\u003c/strong\u003e\u003c/i\u003e (1985) starring Mikhail Baryshnikov, Gregory Hines, and Isabella Rossellini.\u003c/li\u003e\u003cli\u003eThe return of The Paris Theater’s own pristine 70mm print of David Lean’s\u0026nbsp;\u003ci\u003e\u003cstrong\u003eLawrence of Arabia\u003c/strong\u003e\u003c/i\u003e, as well as 70mm prints of\u0026nbsp;\u003ci\u003e\u003cstrong\u003e2001: A Space Odyssey\u003c/strong\u003e\u003c/i\u003e,\u0026nbsp;\u003ci\u003e\u003cstrong\u003eVertigo\u003c/strong\u003e\u003c/i\u003e,\u0026nbsp;\u003ci\u003e\u003cstrong\u003eOnce Upon a Time…In Hollywood\u003c/strong\u003e\u003c/i\u003e, \u003ci\u003e\u003cstrong\u003eBoogie Nights\u003c/strong\u003e\u003c/i\u003e and\u0026nbsp;\u003ci\u003e\u003cstrong\u003eSpartacus\u003c/strong\u003e\u003c/i\u003e.\u0026nbsp;\u0026nbsp;\u003cbr\u003e\u0026nbsp;\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003eSpecial guests:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cstrong\u003eSofia Coppola\u003c/strong\u003e will join us for a Q\u0026amp;A following the New York premiere of a new 4K Restoration of\u0026nbsp;\u003ci\u003e\u003cstrong\u003eMarie Antoinette\u003c/strong\u003e\u003c/i\u003e, celebrating its 20th anniversary this year.\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eIsabella Rossellini\u003c/strong\u003e will appear for a Q\u0026amp;A following a rare 70mm screening of\u0026nbsp;\u003ci\u003e\u003cstrong\u003eWhite Nights\u003c/strong\u003e\u003c/i\u003e.\u003c/li\u003e\u003cli\u003eBob Dylan Center director\u0026nbsp;\u003cstrong\u003eSteven Jenkins\u003c/strong\u003e returns to the Paris with\u0026nbsp;\u003ci\u003eStepping Into the Unknown: Films from the Bob Dylan Center\u003c/i\u003e, featuring a new collection of rare and previously unreleased material from the Bob Dylan Archive, followed by a discussion with and live performance by award-winning musician\u0026nbsp;\u003cstrong\u003eBill Frisell\u003c/strong\u003e.\u0026nbsp;\u0026nbsp;\u003cbr\u003e\u0026nbsp;\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003eAdditional highlights:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eThe East Coast premiere of a new 4K restoration of Martin Scorsese's\u0026nbsp;\u003ci\u003e\u003cstrong\u003eNew York, New York,\u0026nbsp;\u003c/strong\u003e\u003c/i\u003eand the New York premiere of a new 4K restoration of\u0026nbsp;\u003ci\u003e\u003cstrong\u003ePanic Room\u003c/strong\u003e\u003c/i\u003e approved by David Fincher.\u003c/li\u003e\u003cli\u003e\u003ci\u003e9 films presented in Dolby Atmos, including the\u0026nbsp;\u003cstrong\u003eLord of the Rings\u003c/strong\u003e trilogy’s original theatrical versions,\u0026nbsp;\u003cstrong\u003eBack to the Future\u003c/strong\u003e,\u0026nbsp;\u003cstrong\u003eBarbie\u003c/strong\u003e,\u0026nbsp;\u003cstrong\u003eBlade Runner: The Final Cut\u003c/strong\u003e,\u0026nbsp;\u003cstrong\u003eMad Max: Fury Road\u003c/strong\u003e, and\u0026nbsp;\u003cstrong\u003eAtomic Blonde\u003c/strong\u003e.\u003c/i\u003e\u003c/li\u003e\u003cli\u003eTo celebrate Star Trek Day on September 8th, we will host a double feature of\u0026nbsp;\u003ci\u003e\u003cstrong\u003eStar Trek: The Motion Picture\u003c/strong\u003e\u003c/i\u003e (The Director's Edition in 4K \u0026amp; Dolby Atmos) and\u0026nbsp;\u003ci\u003e\u003cstrong\u003eStar Trek II: The Wrath of Khan \u003c/strong\u003e\u003c/i\u003e(The Director's Cut).\u003c/li\u003e\u003cli\u003e35mm prints of two films with iconic soundtracks: Lynne Ramsay’s\u0026nbsp;\u003ci\u003e\u003cstrong\u003eMorvern Callar\u0026nbsp;\u003c/strong\u003e\u003c/i\u003estarring Samantha Morton, and Louis Malle’s\u0026nbsp;\u003ci\u003e\u003cstrong\u003eElevator to the Gallows\u003c/strong\u003e\u003c/i\u003e scored by Miles Davis.\u0026nbsp;\u0026nbsp;\u003cbr\u003e\u0026nbsp;\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eThe series originally debuted in 2023 upon the historic Paris Theater's reopening to showcase its newly installed Dolby Atmos sound system and the technology to screen 70mm for the first time in fifteen years. With over 500 seats, Manhattan's last remaining single-screen theater also became its largest Atmos cinema.\u0026nbsp;\u0026nbsp;\u003cbr\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eThis year's edition of \u003cstrong\u003eBig \u0026amp; Loud\u003c/strong\u003e features\u0026nbsp;\u003cstrong\u003e48 films\u003c/strong\u003e, including\u0026nbsp;\u003cstrong\u003e17 films on 70mm\u003c/strong\u003e and\u0026nbsp;\u003cstrong\u003e10 films presented with special Dolby Atmos sound mixes\u003c/strong\u003e.\u0026nbsp;\u003c/p\u003e"])</script><script>self.__next_f.push([1,"18:T457,\u003cp\u003e\u003ci\u003e\u003cstrong\u003eIntroduced by writer \u0026amp; critic Matt Zoller Seitz on August 23.\u003c/strong\u003e\u003c/i\u003e\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003ci\u003e\u003cstrong\u003eScreening in 70MM \u003c/strong\u003e\u003c/i\u003e\u003cstrong\u003e|\u003c/strong\u003e\u003ci\u003e\u003cstrong\u003e Special Roadshow Presentation, including an overture, 10 minute intermission and entr'acte.\u003c/strong\u003e\u003c/i\u003e\u003cbr\u003e\u003cbr\u003e\"I'm sorry Dave. I'm afraid I can't do that.\" Hal 9000\u0026nbsp;\u003cbr\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eStanley Kubrick redefined the limits of filmmaking in his classic science fiction masterpiece, a contemplation on the nature of humanity, 2001: A SPACE ODYSSEY. Stone Age Earth: In the presence of a mysterious black obelisk, pre-humans discover the use of tools--and weapons--violently taking first steps toward intelligence. 1999: On Earth's moon astronauts uncover another mysterious black obelisk. 2001: Between Earth and Jupiter, the spacecraft's intelligent computer makes a mistake that kills most of the human crew--then continues to kill to hide its error. Beyond Time: The sole survivor of the journey to Jupiter ascends to the next level of humanity. Based on the short story \"The Sentinel\" by Arthur C. Clarke.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e19:T527,Spanning decades and musical styles, this far-ranging one-hour program of short films and videos from the Bob Dylan Archive features rare and previously unreleased clips of Dylan on stage and in the studio. Selections include Dylan’s first film soundtrack for 1961’s “Autopsy on Operation Abolition;” a devastating solo rendition of “Ballad of Hollis Brown” from the 1963 TV special “Folk Songs and More Folk Songs;” a rollicking 1976 take on “I Pity the Poor Immigrant” with Joan Baez; a gospel-infused “Blowin’ in the Wind;” an apocalyptically rocking “When the Night Comes Falling from the Sky” with Dylan backed by Tom Petty and the Heartbreakers; loving tributes to Johnny Cash and Tony Bennett; a glimpse into the Archive’s film restoration project with never-before-seen footage of “It’s All Over Now, Baby Blue” from 1966; and many\nmore treasures.\n\nBob Dylan Center Director "])</script><script>self.__next_f.push([1,"Steven Jenkins will present the films and engage in a post-screening\ndiscussion.\n\nThe Bob Dylan Center opened in Tulsa, OK in May 2022 as the permanent home of the Bob Dylan Archive. The mission of the Center is to inspire and celebrate fearless creativity by exploring the music and artistry of the Nobel Prize–winning singer-songwriter as a catalyst for personal expression and cultural change.1a:Tac9,"])</script><script>self.__next_f.push([1,"\u003cp\u003eSpanning decades and musical styles, this far-ranging one-hour program of short films and videos from the Bob Dylan Archive features rare and previously unreleased clips of Dylan on stage and in the studio—all different from last year’s presentation. Selections include early acoustic versions of “Blowin’ in the Wind” and “Girl from the North Country;” an intense rendition of “Isis” from the Rolling Thunder Revue, with Dylan in face paint; a delicate performance of “Simple Twist of Fate” featuring Scarlet Rivera on violin; The Band backing a swaggering run-through of “Baby Let Me Follow You Down;” a cover of Woody Guthrie’s “Vigilante Man” with Ry Cooder and Van Dyke Parks; a glimpse into the Archive’s film restoration project with never-before-seen footage of “It’s All Over Now, Baby Blue” from 1966; and many more treasures.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003ci\u003e\u003cstrong\u003eBob Dylan Center Director Steven Jenkins will present the program and engage in a post-screening discussion about the films and the mission and activities of the Center with special guest Bill Frisell, who will round out the program with a brief solo-electric performance.\u003c/strong\u003e\u003c/i\u003e\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003ci\u003eThis program is generously supported by the Salisbury Fund.\u003c/i\u003e\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eBob Dylan Center\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eThe Bob Dylan Center opened in Tulsa, OK in May 2022 as the permanent home of the Bob Dylan Archive. The mission of the Center is to inspire and celebrate fearless creativity by exploring the music and artistry of the Nobel Prize–winning singer-songwriter as a catalyst for personal expression and cultural change.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eBill Frisell\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eOver fifty years, thousands of performances and dozens of award-winning recordings, Bill Frisell has honed a gleefully unclassifiable sound on electric guitar in a creative journey marked by wonderfully rewarding left turns and musical surprises. A partial list of Frisell’s collaborators includes Ron Carter, Elvis Costello, Marianne Faithfull, the Frankfurt Ballet, Allen Ginsberg, Petra Haden, Rickie Lee Jones, Allison Krauss, the Los Angeles Philharmonic, Van Dyke Parks, Robert Plant, Ron Sexsmith, Paul Simon, McCoy Tyner, Gus Van Sant, Suzanne Vega, Louden Wainwright III, Lucinda Williams, Hal Wilner and John Zorn. In March 2026, the Bob Dylan Center presented Frisell’s 75\u003csup\u003eth\u003c/sup\u003e-birthday celebration in Tulsa, for which he performed stunning new arrangements of many of his favorite Dylan songs in a trio format. In September 2022, Frisell participated in A Tribute to Bob Dylan, a multi-artist evening of live performances curated by T Bone Burnett and presented at The Town Hall in partnership with the Bob Dylan Center.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"1b:T415,\u003cp\u003eEveryone has one special thing... In 1977 sex was safe; pleasure was a business ... and business was booming. Mark Wahlberg, Burt Reynolds, Julianne Moore, Don Cheadle and William H. Macy star as a family of filmmakers struggling to redefine and revolutionize the adult entertainment industry in Boogie Nights. Idealistic producer Jack Horner (Burt Reynolds) aspires to elevate his craft into an art form. Teenager Eddie Adams (Mark Wahlberg) discovers a talent that will propel him to celebrity as adult entertainer Dirk Diggler. Now, at a time when disco and drugs are in vogue, fashion is in flux and the party never seems to stop, dreams of turning sex into stardom are about to collide with cold, hard reality.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eAcademy Award nominations: Best Actor in a Supporting Role (Burt Reynolds) Best Actress in a Supporting Role (Julianne Moore) Best Writing, Screenplay Written Directly for the Screen (Paul Thomas Anderson).\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003ci\u003eDigital screenings (on DCP) feature the 4K restoration in Dolby Atmos.\u003c/i\u003e\u003c/p\u003e1c:T4ac,Oscar®-winning filmmaker Paul Thomas f the psychedelic '60s and paranoia is running the day and Doc knows that \"love\" is another of those words going around at the moment, like \"trip\" or \"groovy,\" that's being way too overused -- except this one usually leads to trouble. With a cast of characters that includes surfers, hustlers, dopers and rockers, a murderous loan shark, LAPD Detectives, a tenor sax player working undercover, and a mysterious entity known as the Golden Fang, which may only be a tax dodge set up by some dentists, \u003ci\u003e\u003cstrong\u003eInherent Vice\u003c/strong\u003e\u003c/i\u003e is part surf noir, part psychedelic romp -- but all Thomas Pynchon.\u003c/p\u003e1e:T612,\u003cp\u003e\u003cstrong\u003eQ\u0026amp;A with filmmaker Sofia Coppola!\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003ci\u003e\u003cstrong\u003eSpotlight Presentation, New York Premiere of New 4K Restoration, 20th Anniversary\u003c/strong\u003e\u003c/i\u003e\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eAn electrifying yet intimate re-telling of the turbulent life of history's favorite villainess, Marie Antoinette, who married France's young and indifferent King Louis XVI.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003ci\u003e\u003cstrong\u003eMarie Antoinette \u003c/strong\u003ewas restored in 4K by Sony Pictures Entertainment in collaboration with American Zoetrope. \u0026nbsp;Restored fr"])</script><script>self.__next_f.push([1,"om the 35mm Original Picture Negative, scanned in 4K by Prasad Corp., Burbank. Audio preparation and conform by Sony Sound, Culver City from the original 5.1 track sources. \u0026nbsp;Color grading by Roundabout, Burbank with colorist Gregg Garvin. Color approval by Cinematographer Lance Acord and Sofia Coppola. Restoration supervised by Rita Belda for SPE and James Mockoski for American Zoetrope.\u003c/i\u003e\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003ci\u003eOther anniversary celebrations of the film include \u003c/i\u003e\u003ca href=\"https://www.mackbooks.us/products/making-marie-antoinette-andrew-durham\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003cspan style=\"color:inherit;\"\u003e\u003ci\u003eMaking Marie Antoinette\u003c/i\u003e\u003c/span\u003e\u003c/a\u003e\u003ci\u003e, a book of Andrew Durham's photographs, and an \u003c/i\u003e\u003ca href=\"https://en.chateauversailles.fr/press/exhibitions/chateau-versailles-celebrates-20th-anniversary-marie-antoinette-sofia-coppola\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003cspan style=\"color:inherit;\"\u003e\u003ci\u003eexhibition\u003c/i\u003e\u003c/span\u003e\u003c/a\u003e\u003ci\u003e at the Château de Versailles in France.\u003c/i\u003e\u003c/p\u003e1f:T664,\u003cp\u003eIn celebration of Star Trek Day, The Paris Theater is presenting a double feature screening of \u003ci\u003e\u003cstrong\u003eStar Trek: The Motion Picture \u003c/strong\u003e\u003c/i\u003eand \u003ci\u003e\u003cstrong\u003eStar Trek II: The Wrath of Khan\u003c/strong\u003e\u003c/i\u003e!\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eSTAR TREK: THE MOTION PICTURE (THE DIRECTOR'S EDITION)\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003ci\u003e\u003cstrong\u003eIn Dolby Atmos \u0026amp; 4K! \u003c/strong\u003e\u003c/i\u003eSee the original theatrical version of the film as it was initially released in theaters. A massive alien presence of enormous power enters Federation space destroying three powerful Klingon cruisers and neutralizing everything in its path. As it heads towards Earth, Admiral James T. Kirk returns to the helm of an updated U.S.S. Enterprise and sets course to meet the aggressor head-on. (136 min., DCP)\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eSTAR TREK II: THE WRATH OF KHAN (THE DIRECTOR'S CUT)\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eIt is the 23rd century. The Federation Starship U.S.S. Enterprise™ is on routine training maneuvers and Admiral James T. Kirk (William Shatner) seems resigned to th"])</script><script>self.__next_f.push([1,"e fact that this inspection may well be the last space mission of his career. But Khan is back. Aided by his exiled band of genetic supermen, Khan (Ricardo Montalban) - brilliant renegade of 20th century Earth - has raided Space Station Regula One, stolen a top secret device called Project Genesis, wrested control of another Federation Starship and sets out in pursuit of the Enterprise, determined to let nothing stand in the way of his mission: kill Admiral Kirk... even if it means universal Armageddon. (113 min., DCP)\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003ci\u003eThere will be a 15 minute intermission between features.\u003c/i\u003e\u003c/p\u003e20:T588,\u003cp\u003e\u003ci\u003e\u003cstrong\u003eFeaturing the Roadshow version, including an overture, intermission and exit music.\u003c/strong\u003e\u003c/i\u003e\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003ci\u003e\u003cstrong\u003e4K Restoration! \u003c/strong\u003e\u003c/i\u003eFrom Bob Fosse, the legendary director of \u003ci\u003eCabaret\u003c/i\u003e, \u003ci\u003eLenny\u003c/i\u003e, \u003ca href=\"https://www.paristheaternyc.com/film/all-that-jazz-paris\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003eAll That Jazz\u003c/i\u003e\u003c/a\u003e and \u003ci\u003eStar 80\u003c/i\u003e. Hollywood royalty Shirley MacLaine (\u003ci\u003eIrma La Douce\u003c/i\u003e) gives one of her greatest performances in this spectacular musical based on Neil Simon’s (\u003ci\u003eThe Odd Couple\u003c/i\u003e) Broadway hit inspired by Federico Fellini’s \u003ci\u003eNights of Cabiria.\u003c/i\u003e Director Fosse broke new cinematic ground with this freewheeling, visually stunning story of a lovelorn New York dance hall hostess, Charity Hope Valentine (MacLaine), who dreams of old-fashioned romance but gives her heart to one undeserving guy after another. MacLaine joins all-star cast members Chita Rivera (\u003ci\u003eChicago\u003c/i\u003e), Sammy Davis Jr. (\u003ci\u003eA Man Called Adam\u003c/i\u003e), Ricardo Montalban (\u003ci\u003eMadame X\u003c/i\u003e), Ben Vereen (\u003ci\u003eFunny Lady\u003c/i\u003e) and Stubby Kaye (\u003ci\u003eGuys and Dolls\u003c/i\u003e) in belting out thirteen vibrant Cy Coleman-Dorothy Fields numbers including “Big Spender,” “The Rhythm of Life,” “There's Gotta Be Something Better Than This” and the show-stopping “If My Friends Could See Me Now.” It’s an unforgettable production of an all-time classic.\u003c/p\u003e21:T411,From "])</script><script>self.__next_f.push([1,"Terrence Malick, the acclaimed director of such classic films as BADLANDS, DAYS OF HEAVEN and THE THIN RED LINE, THE TREE OF LIFE is the impressionistic story of a Midwestern family in the 1950's. The film follows the life journey of the eldest son, Jack, through the innocence of childhood to his disillusioned adult years as he tries to reconcile a complicated relationship with his father (Brad Pitt). Jack (played as an adult by Sean Penn) finds himself a lost soul in the modern world, seeking answers to the origins and meaning of life while questioning the existence of faith. Through Malick's signature imagery, we see how both brute nature and spiritual grace shape not only our lives as individuals and families, but all life.\n\n\n\nPreceded by Good kid, m.A.A.d city:\n\nA stirring, cinematic tribute to the city of Compton, and a beguiling non-linear paean to everyday moments of life, death and magic - all set to the textured, often abstract lyrics of Compton-born rapper Kendrick Lamar. (Directed by Kahlil Joseph; 15 minutes)22:Ta7a,"])</script><script>self.__next_f.push([1,"\u003cp\u003e\u003ci\u003e\u003cstrong\u003ePossible Love\u003c/strong\u003e\u003c/i\u003e, the first feature film in eight years from internationally acclaimed auteur\u0026nbsp;\u003cstrong\u003eLee Chang-dong\u003c/strong\u003e, will release in select theaters on October 23, and stream only on Netflix starting November 6. The film, which held its World Premiere at this year’s Venice Film Festival and won the Silver Lion Grand Jury Prize, follows the intertwined relationship of two married couples facing different paths and hidden desires.\u0026nbsp;\u003cbr\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eTo celebrate the release of Director Lee’s latest triumph, The Paris Theater is proud to announce\u0026nbsp;\u003cstrong\u003eFreedom and Desire: The Films of Lee Chang-dong\u003c/strong\u003e, the first retrospective of Director Lee’s in New York City to feature all eight of his films as director, including the U.S. premiere of the 2022 short film,\u0026nbsp;\u003ci\u003e\u003cstrong\u003eHeartbeat\u003c/strong\u003e\u003c/i\u003e\u003cstrong\u003e.\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eWhen discussing his latest film, Director Lee notes how\u0026nbsp;\u003ci\u003ePossible Love\u003c/i\u003e reflects his belief that no matter the pain, struggle, frustration and despair we face in life, what allows us to overcome these obstacles is our desire for freedom. This powerful notion echoes throughout his filmography, with characters constantly pursuing more than what their circumstances in life have given them –\u0026nbsp; from his first feature\u0026nbsp;\u003ci\u003e\u003cstrong\u003eGreen Fish\u003c/strong\u003e\u003c/i\u003e (1997) through his collection of award-winning masterpieces – including\u0026nbsp;\u003ci\u003e\u003cstrong\u003eOasis\u003c/strong\u003e\u003c/i\u003e (2002, Best Director at Venice FIlm Festival),\u0026nbsp;\u003ci\u003e\u003cstrong\u003eSecret Sunshine\u003c/strong\u003e\u003c/i\u003e (2007, Best Actress at Cannes Film Festival),\u0026nbsp;\u003ci\u003e\u003cstrong\u003ePoetry\u0026nbsp;\u003c/strong\u003e\u003c/i\u003e(2010, Best Screenplay at Cannes Film Festival), and\u0026nbsp;\u003ci\u003e\u003cstrong\u003eBurning\u003c/strong\u003e\u003c/i\u003e (2018, Cannes FIPRESCI Prize). Don’t miss the chance to experience all of these journeys at the Paris!\u0026nbsp;\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eThe series kicks off on Saturday, September 26 with 1999’s\u0026nbsp;\u003ci\u003e\u003cstrong\u003ePeppermint Candy\u003c/strong\u003e\u003c/i\u003e, followed by a Q\u0026amp;A with\u0026nbsp;\u003cstrong\u003eLee Chang-dong\u003c/strong\u003e and his longtime collaborator, actor\u0026nbsp;\u003cstrong\u003eSul Kyung-gu\u003c/strong\u003e (who also stars in\u0026nbsp;\u003ci\u003ePossible Love\u003c/i\u003e).\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eWe’ll close the series on November 24 with\u0026nbsp;\u003ci\u003e\u003cstrong\u003ePossible Love\u0026nbsp;\u003c/strong\u003e\u003c/i\u003e\u003cstrong\u003eon 35mm\u003c/strong\u003e, preceded by the U.S. premiere of Director Lee’s 2022 short film\u0026nbsp;\u003ci\u003e\u003cstrong\u003eHeartbeat\u003c/strong\u003e\u003c/i\u003e\u003cstrong\u003e.\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003ci\u003e\u003cstrong\u003ePossible Love\u003c/strong\u003e\u003c/i\u003e\u003cstrong\u003e opens in select theaters on October 23, including Film at Lincoln Center and Angelika Film Center in New York City. It streams only on Netflix starting November 6.\u003c/strong\u003e\u003c/p\u003e"])</script><script>self.__next_f.push([1,"23:T408,\u003cp\u003e\u003ci\u003e\u003cstrong\u003eQ\u0026amp;A with director Lee Chang-dong and actor Sul Kyung-gu\u003c/strong\u003e\u003c/i\u003e\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003ci\u003e\u003cstrong\u003e4K Restoration! \u003c/strong\u003e\u003c/i\u003eYongho (Sul Kyung-gu) stares down an oncoming train as twenty years of his life flash before his eyes. Proceeding to move backward in time, Lee Chang-dong's acclaimed second directorial feature rewinds the protagonist's loss of humanity - from his fraught, self-hating middle age through his callow teens. The moments in between these events, as seen through the lens of Yongho’s oppressive struggles, mirror South Korea’s traumatic political history during the late 20th century.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eAn official selection of the Directors' Fortnight selection in Cannes and winner of the Special Prize of the Jury at the Karlovy Vary International Film Festival, \u003ci\u003e\u003cstrong\u003ePeppermint Candy\u003c/strong\u003e\u003c/i\u003e is a powerful work of Korean New Wave cinema that elegizes a generation of marginalized people with “quiet, heartbreaking power” (\u003ci\u003eThe New York Times\u003c/i\u003e).\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e24:T4b8,\u003cp\u003e\u003ci\u003eSouth Korea's official selection for International Feature Film at the 99th Academy Awards®\u003c/i\u003e\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003ci\u003eWinner - Silver Lion, Grand Jury Prize, Venice Film Festival\u003c/i\u003e\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003ci\u003e\u003cstrong\u003e35mm print! \u003c/strong\u003e\u003c/i\u003eA story of two married couples — a laid-off worker and his spouse and a documentary filmmaker and her spouse — crossing paths to film a documentary and facing their different lives and hidden desires.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003ci\u003ePreceded by the US Premiere of\u003c/i\u003e\u003cbr\u003e\u003cbr\u003e\u003ci\u003e\u003cstrong\u003eHeartbeat \u003c/strong\u003e\u003c/i\u003e(2022, DCP, 28 min., produced by Qiao Cui)\u003cbr\u003eCaught up in anxiety, eight-year-old Chul in school tells his teacher that he is going to the bathroom, but runs straight home.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eWe are pleased to invite \u003c/strong\u003e\u003ci\u003e\u003cstrong\u003eAMPAS, SAG NOM COMM, BAFTA, PGA, DGA, WGA, ACE, ADG, ASC, CAS, CDG, CSA, MPEG, MPSE, SCL, VES\u003c/strong\u003e\u003c/i\u003e\u003cstrong\u003e Guild Members: Members and a guest are allowed complimentary entry to any publ"])</script><script>self.__next_f.push([1,"ic screening of new release titles on a space-available basis, upon presentation of your membership card at the venue box office 30 minutes prior to showtime (advance reservations not available).\u003c/strong\u003e\u003c/p\u003e25:Tbb6,"])</script><script>self.__next_f.push([1,"\u003cp\u003eOn October 1, Netflix will release Zoe Kazan’s adaptation of John Steinbeck’s masterpiece \u003ci\u003e\u003cstrong\u003eEast of Eden\u003c/strong\u003e\u003c/i\u003e. The seven-episode series features a formidable cast led by Florence Pugh as the indelible antihero Cathy Ames, whose life is intertwined with the lives of generations of men from the Trask family (including Christopher Abbott as Adam and Mike Faist as Charles) as the characters live out the darker side of the California dream. The series arrives over 70 years after the 1955 film adaptation starring James Dean - directed by Elia Kazan, Zoe’s grandfather - focused solely on the book’s final section.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eThat family connection to the material, as well as her own abiding love for the novel, made adapting \u003ci\u003e\u003cstrong\u003eEast of Eden\u003c/strong\u003e\u003c/i\u003e a deeply personal and resonant experience for Zoe Kazan. To celebrate the captivating results of her work, the Paris Theater is proud to present \u003cstrong\u003eThe Monster in All of Us: The Films Behind \u003c/strong\u003e\u003ci\u003e\u003cstrong\u003eEast of Eden\u003c/strong\u003e\u003c/i\u003e, a week-long repertory film series curated in collaboration with Zoe Kazan showcasing films across cinema history that were key inspirations for Kazan throughout her creative process.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eKazan has always been drawn to the character of Cathy Ames – whose enigmatic nature and uncommon sense of agency fascinated her. Many of the films in this series provided inspiration to Kazan as she unfolded more of Cathy’s character out of Steinbeck’s text, including the complex women contained in the performances of Jane Fonda in \u003ci\u003e\u003cstrong\u003eKlute\u003c/strong\u003e\u003c/i\u003e, Barbara Stanwyck in \u003ci\u003e\u003cstrong\u003eStella Dallas\u003c/strong\u003e\u003c/i\u003e, or Scarlett Johansson in \u003ci\u003e\u003cstrong\u003eUnder the Skin\u003c/strong\u003e\u003c/i\u003e. Kazan even found guidance in something Steinbeck once wrote about Cathy in his reflections on writing the novel: “They will forget I said she was bad. And they will hate her because while she is a monster, she is a little piece of the monster in all of us.”\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eThe Monster in All of Us \u003c/strong\u003ewill include a special, free screening of \u003ci\u003e\u003cstrong\u003eEast of Eden\u003c/strong\u003e\u003c/i\u003e episodes 1, 2 \u0026amp; 3 at the Paris Theater, followed by a \u003cstrong\u003eQ\u0026amp;A with Zoe Kazan on Saturday, October 3\u003c/strong\u003e. Later that evening, Kazan will introduce a 35mm presentation of the 1955 film adaptation of \u003ci\u003e\u003cstrong\u003eEast of Eden\u003c/strong\u003e\u003c/i\u003e, directed by Elia Kazan and starring James Dean, Raymond Massey, and Jo Van Fleet in an Academy Award®-winning performance as Cathy.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eZoe Kazan will also give special in-person introductions\u003c/strong\u003e to a 35mm presentation of \u003ci\u003e\u003cstrong\u003eKlute\u003c/strong\u003e\u003c/i\u003e on \u003cstrong\u003eFriday, October 2 at 6:45 PM\u003c/strong\u003e and to Alfred Hitchcock’s \u003ci\u003e\u003cstrong\u003eNotorious\u003c/strong\u003e\u003c/i\u003e on \u003cstrong\u003eSunday, October 4 at 5:45 PM\u003c/strong\u003e.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eSelect screenings will feature pre-recorded introductions from Zoe Kazan, discussing how each film influenced her work on the series.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"26:T798,\u003cp\u003eThis Fall, the Paris Theater is thrilled to welcome\u0026nbsp;\u003cstrong\u003eKarina Longworth\u003c/strong\u003e, the creator, writer, producer and narrator of\u0026nbsp;\u003ca href=\"https://www.youmustrememberthispodcast.com/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003ci\u003e\u003cstrong\u003eYou Must Remember This\u003c/strong\u003e\u003c/i\u003e\u003c/a\u003e,\u0026nbsp;the podcast dedicated to exploring the secret and/or forgotten histories of Hollywood's first century. Longworth will join us for two screenings in celebration of her podcast’s new season called \"The Bisexuals”, debuting September 15.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eSpanning eight episodes with\u0026nbsp;a cast of characters including Elizabeth Taylor, Montgomery Clift, Josephine Baker, Tallulah Bankhead, Billie Holiday, Jane and Paul Bowles, Nicholas Ray\u0026nbsp;and more, \"The Bisexuals\" will explore the story of Libby Holman, the sultry singer who became a Broadway sensation in the late 1920s and 30s, led a sexually fluid social life, and was embroiled in scandal when she was indicted for the murder of her husband, the heir to the R.J. Reynolds tobacco fortune.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eThis series features two screenings starring Montgomery Clift, one of the key players in Holman’s social circle:\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cul\u003e\u003cli\u003eOn Saturday, October 31 at 12:00 PM, Karina Longworth will give an extended introduction to an archival 35mm print of George orial feature rewinds the protagonist's loss of humanity - from his fraught, self-hating middle age through his callow teens. The moments in between these events, as seen through the lens of Yongho’s oppressive struggles, mirror South Korea’s traumatic political history during the late 20th century.\\n\\nAn official selection of the Directors' Fortnight selection in Cannes and winner of the Special Prize of the Jury at the Karlovy Vary International Film Festival, PEPPERMINT CANDY is a powerful work of Korean New Wave cinema that elegizes a generation of marginalized people with “quiet, heartbreaking power” (The New York Times). Presented in a 4K restoration.\",\"Rating\":null,\"Runtime\":129,\"VistaID\":null,\"IsComingSoon\":null,\"IsFeatured\":false,\"ClosingDate\":\"2026-09-26\",\"FeaturedFilmLabel\":\"Lee Chang-dong\",\"FeaturedFilmSubtextOverride\":null,\"HeroDetails\":\"Q\u0026A with director Lee Chang-dong and actor Sul Kyung-gu on September 26\",\"RedLabelOverride\":\"Freedom and Desire: The Films of Lee Chang-dong\",\"IsAmericanCinematheque\":null,\"AmericanCinemathequeFeaturedTicketsLink\":null,\"PhotoGalleryIntroCopy\":null,\"SynopsisWYSIWYG\":\"$23\",\"FilmFormat\":\"DCP\",\"HasThirdPartyTicketLink\":null,\"ThirdPartyTicketLink\":null,\"createdAt\":\"2026-09-01T16:17:28.551Z\",\"updatedAt\":\"2026-09-26T15:00:12.815Z\",\"publishedAt\":\"2026-09-14T19:28:35.427Z\",\"Association\":[\"Paris\"],\"VistaIDOverride\":\"HO00001538\",\"Year\":\"2000\",\"Accessibility\":[\"hi\"],\"Language\":\"Korean with English subtitles\",\"DisplayTitle\":\"Peppermint Candy - \u003cParis\u003e\",\"HideDates\":null,\"SearchKeywords\":null,\"Distributor\":null,\"PrintSource\":null,\"TheatricalOpeningDate\":null}},{\"id\":1991,\"attributes\":{\"FilmName\":\"Green Fish\",\"Slug\":\"green-fish-paris\",\"TrailerLink\":null,\"Director\":\"Lee Chang-dong\",\"Cast\":\"Han Suk-kyu, \\nShim Hye-jin, \\nMoon Sung-Keun, \\nYu-Kyeong Cha, \\nSong Kang-ho\",\"OpeningDate\":\"2026-10-03\",\"Synopsis\":\"Released from his mandatory military service, Makdong (Han Suk-gyu) returns to a hometown he no longer recognizes. After rescuing a beautiful young woman from harassment on a train, his life takes an unexpected turn when she unwittingly lures him into the criminal underworld. Finding himself in a dangerous love triangle with the local crime boss, Makdong must face the dire consequences of his choices.\\n\\nWinner of the Best Film and Best New Director awards from the Korean Film Critics Association, Lee Chang-dong's GREEN FISH is a “wrenching, tonally nuanced first film” (Senses of Cinema) that combines “strong narrative drive, powerful visuals and a mind-blowing central performance” (Eastern Kicks). Presented in a 4K restoration.\",\"Rating\":null,\"Runtime\":111,\"VistaID\":null,\"IsComingSoon\":null,\"IsFeatured\":false,\"ClosingDate\":\"2026-10-03\",\"FeaturedFilmLabel\":\"Lee Chang-dong\",\"FeaturedFilmSubtextOverride\":null,\"HeroDetails\":\"Lee Chang-dong's POSSIBLE LOVE opens in theaters on October 23, on Netflix November 6\",\"RedLabelOverride\":\"Freedom and Desire: The Films of Lee Chang-dong\",\"IsAmericanCinematheque\":null,\"AmericanCinemathequeFeaturedTicketsLink\":null,\"PhotoGalleryIntroCopy\":null,\"SynopsisWYSIWYG\":\"\u003cp\u003e\u003ci\u003e\u003cstrong\u003e4K Restoration! \u003c/strong\u003e\u003c/i\u003eReleased from his mandatory military service, Makdong (Han Suk-gyu) returns to a hometown he no longer recognizes. After rescuing a beautiful young woman from harassment on a train, his life takes an unexpected turn when she unwittingly lures him into the criminal underworld. Finding himself in a dangerous love triangle with the local crime boss, Makdong must face the dire consequences of his choices.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eWinner of the Best Film and Best New Director awards from the Korean Film Critics Association, Lee Chang-dong's \u003ci\u003e\u003cstrong\u003eGreen Fish \u003c/strong\u003e\u003c/i\u003eis a “wrenching, tonally nuanced first film” (\u003ci\u003eSenses of Cinema\u003c/i\u003e) that combines “strong narrative drive, powerful visuals and a mind-blowing central performance” (\u003ci\u003eEastern Kicks\u003c/i\u003e).\u003c/p\u003e\",\"FilmFormat\":\"DCP\",\"HasThirdPartyTicketLink\":null,\"ThirdPartyTicketLink\":null,\"createdAt\":\"2026-09-01T16:09:51.787Z\",\"updatedAt\":\"2026-09-28T15:00:10.991Z\",\"publishedAt\":\"2026-09-14T19:28:36.992Z\",\"Association\":[\"Paris\"],\"VistaIDOverride\":\"HO00001536\",\"Year\":\"1997\",\"Accessibility\":[\"hi\"],\"Language\":\"Korean with English subtitles\",\"DisplayTitle\":\"Green Fish - \u003cParis\u003e\",\"HideDates\":null,\"SearchKeywords\":null,\"Distributor\":null,\"PrintSource\":null,\"TheatricalOpeningDate\":null}},{\"id\":1992,\"attributes\":{\"FilmName\":\"Oasis\",\"Slug\":\"oasis-paris\",\"TrailerLink\":null,\"Director\":\"Lee Chang-dong\",\"Cast\":\"Sol Kyung-gu, \\nMoon So-ri\",\"OpeningDate\":\"2026-10-04\",\"Synopsis\":\"Fresh out of prison, Hong Jong-du (Sul Kyung-gu) finds an unlikely soulmate in Gong-ju (Moon So-ri), the daughter of the victim of the hit-and-run accident for which he went to jail. Wheelchair-bound and suffering from severe cerebral palsy, Gong-ju is kept cloistered in a cheap apartment by her brother, whose only concern is the government assistance she receives. Over a series of clandestine meetings, the two begin an improbable relationship that defies the judgment and cruelty of the world around them.\\n\\n\\n\\nWinner of the Silver Lion for Best Director and Best Young Actress at the Venice Film Festival, Lee Chang-dong's OASIS is a “brave film” that “shows two people who find any relationship almost impossible, and yet find a way to make theirs work” (Roger Ebert, Chicago Sun-Times). Presented in a  4K restoration.\",\"Rating\":null,\"Runtime\":133,\"VistaID\":null,\"IsComingSoon\":null,\"IsFeatured\":false,\"ClosingDate\":\"2026-10-04\",\"FeaturedFilmLabel ,{\"id\":1995,\"attributes\":{\"FilmName\":\"Secret Sunshine\",\"Slug\":\"secret-sunshine-paris\",\"TrailerLink\":null,\"Director\":\"Lee Chang-dong\",\"Cast\":\"Jeon Do-yeon, \\nSong Kang-ho\",\"OpeningDate\":\"2026-10-11\",\"Synopsis\":\"When her husband passes away in an automobile accident, Shin-ae relocates down south to her late husband’s hometown of Miryang. Despite her efforts to settle down, in this unfamiliar and much too normal place, she finds that she can’t quite fit in. Helping her out is Kim Jong-chan, a good-intentioned but bothersome bachelor, who owns a car repair shop. Life plods on. However, fate takes a vicious turn when Shin-ae loses her son in the most horrific way a mother could imagine. She turns to Christianity to relieve the pain in her heart, but when even this is not permitted, she wages a war against God.\",\"Rating\":null,\"Runtime\":142,\"VistaID\":null,\"IsComingSoon\":null,\"IsFeatured\":false,\"ClosingDate\":\"2026-10-11\",\"FeaturedFilmLabel\":\"Lee Chang-dong\",\"FeaturedFilmSubtextOverride\":null,\"HeroDetails\":\"Lee Chang-dong's POSSIBLE LOVE opens in theaters on October 23, on Netflix November 6\",\"RedLabelOverride\":\"Freedom and Desire: The Films of Lee Chang-dong\",\"IsAmericanCinematheque\":null,\"AmericanCinemathequeFeaturedTicketsLink\":null,\"PhotoGalleryIntroCopy\":null,\"SynopsisWYSIWYG\":\"\u003cp\u003eWhen her husband passes away in an automobile accident, Shin-ae relocates down south to her late husband’s hometown of Miryang. Despite her efforts to settle down, in this unfamiliar and much too normal place, she finds that she can’t quite fit in. Helping her out is Kim Jong-chan, a good-intentioned but bothersome bachelor, who owns a car repair shop. Life plods on. However, fate takes a vicious turn when Shin-ae loses her son in the most horrific way a mother could imagine. She turns to Christianity to relieve the pain in her heart, but when even this is not permitted, she wages a war against God.\u003c/p\u003e\",\ mery Clift stars as George Eastman, a handsome and charming but basically aimless young man who goes to work in a factory run by a distant, wealthy relative. Feeling lonely one evening, he has a brief rendezvous with assembly-line worker Alice Tripp (Shelley Winters), but he forgets all about her when he falls for dazzling socialite Angela Vickers (Elizabeth Taylor). Alice can't forget about him, though: she is pregnant with his child. Just when George's personal and professional futures seem assured, Alice demands that he marry her or she'll expose him to his society friends.\u0026nbsp;\u003cbr\u003e\u003cbr\u003e\u003ci\u003e35mm archival print from the Collection of the Library of Congress.\u003c/i\u003e\u003c/p\u003e\",\"FilmFormat\":\"ARCHIVAL 35MM\",\"HasThirdPartyTicketLink\":false,\"ThirdPartyTicketLink\":null,\"createdAt\":\"2025-02-28T17:44:52.787Z\",\"updatedAt\":\"2026-09-28T15:00:06.473Z\",\"publishedAt\":\"2026-09-01T14:56:38.049Z\",\"Association\":[\"Paris\"],\"VistaIDOverride\":\"HO00000726\",\"Year\":\"1951\",\"Accessibility\":[\"hi\"],\"Language\":null,\"DisplayTitle\":\"A Place in the Sun - \u003cParis\u003e\",\"HideDates\":null,\"SearchKeywords\":null,\"Distributor\":null,\"PrintSource\":null,\"TheatricalOpeningDate\":null}},{\"id\":1988,\"attributes\":{\"FilmName\":\"Wild River\",\"Slug\":\"wild-river-paris\",\"TrailerLink\":null,\"Director\":\"Elia Kazan\",\"Cast\":\"Montgomery Clift, \\nLee Remick, \\nJo Van Fleet\",\"OpeningDate\":\"2026-11-01\",\"Synopsis\":\"Eager to further his career, ambitious Tennessee Valley Authority administrator Chuck Glover (Montgomery Clift) journeys to a small town to oversee the clearing of the valley in preparation for the construction of a new dam. His plans meet with opposition in the form of the town's stubborn matriarch, 80-year-old Ella Garth (Jo Van Fleet), who refuses to leave. As Glover attempts to convince Garth, he falls in love with her granddaughter, Carol Garth Baldwin (Lee Remick).\",\"Rating\":nu "],\"PageWrapper\"]\n36:I[18829,[\"6990\",\"static/chunks/13b76428-e1bf383848c17260.js\",\"7326\",\"static/chunks/2626716e-b496a3b36b79551a.js\",\"1992\",\"static/chunks/1992-c579a9daff76c160.js\",\"3797\",\"static/chunks/3797-b2498c1c16e7c1d6.js\",\"9467\",\"static/chunks/9467-4650de9746cfb0f2.js\",\"4575\",\"static/chunks/4575-9dbdfc41b9c8cc74.js\",\"1931\",\"static/chunks/app/page-4ce2f93844c3edff.js\"],\"default\"]\n37:I[21624,[\"6990\",\"static/chunks/13b76428-e1bf383848c17260.js\",\"7326\",\"static/chunks/2626716e-b496a3b36b79551a.js\",\"1992\",\"static/chunks/1992-c579a9daff76c160.js\",\"3797\",\"static/chunks/3797-b2498c1c16e7c1d6.js\",\"9467\",\"static/chunks/9467-4650de9746cfb0f2.js\",\"4575\",\"static/chunks/4575-9dbdfc41b9c8cc74.js\",\"1931\",\"static/chunks/app/page-4ce2f93844c3edff.js\"],\"FeaturedSliderHandler\"]\n38:T1866,"])</script><script>self.__next_f.push([1,"\u003cp\u003eThe Paris Theater is proud to present our full lineup for the fourth annual\u0026nbsp;\u003cstrong\u003eBig \u0026amp; Loud\u003c/strong\u003e, our flagship repertory series which has now been extended to five-and-a-half weeks of cinema's most unforgettable sensory experiences.\u0026nbsp;\u0026nbsp;\u003cbr\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eEach summer, New Yorkers look to The Paris Theater, the city’s last remaining single-screen movie palace, for the theater’s ability to deliver state-of-the-art, immersive moviegoing experiences, with each uniquely theatrical presentation reveling either in the legendary visual power of 70mm, the all-encompassing aural design enabled by Dolby Atmos, or stories supercharged by sound design.\u0026nbsp;\u0026nbsp;\u003cbr\u003e\u003cbr\u003e\u003cstrong\u003eWe’re halfway into Big \u0026amp; Loud, and the response has been thunderous. Sold-out crowds for rare 70mm prints, Dolby Atmos soundtracks rattling the walls of the Paris, and even a special live musical performance from Bill Frisell!\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eWe want to keep the party going, so The Paris Theater is happy to announce two special encore weeks of Big \u0026amp; Loud, extending through September 29!\u0026nbsp;\u003cbr\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eSome of our most popular titles will have new screenings added, including 70mm shows of\u0026nbsp;\u003ci\u003eLawrence of Arabia\u003c/i\u003e,\u0026nbsp;\u003ci\u003e2001: A Space Odyssey\u003c/i\u003e,\u0026nbsp;\u003ci\u003eWest Side Story\u003c/i\u003e,\u0026nbsp;\u003ci\u003eThe Sound of Music\u003c/i\u003e,\u0026nbsp;\u003ci\u003eBoogie Nights\u003c/i\u003e,\u0026nbsp;\u003ci\u003eBabylon\u003c/i\u003e, and\u0026nbsp;\u003ci\u003eThe Master\u003c/i\u003e. We’re also bringing back shows of best-sellers like Michael Mann’s\u0026nbsp;\u003ci\u003eHeat\u003c/i\u003e, Bob Fosse’s\u0026nbsp;\u003ci\u003eAll That Jazz\u003c/i\u003e, and Ridley Scott’s\u0026nbsp;\u003ci\u003eBlade Runner: The Final Cut\u003c/i\u003e in Dolby Atmos.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eAnd as a special treat, we’re adding a few new films to the mix:\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cul\u003e\u003cli\u003eThe 4K Restoration of Stanley Kubrick’s\u0026nbsp;\u003ci\u003eBarry Lyndon\u003c/i\u003e\u003c/li\u003e\u003cli\u003eA 35mm screening of Terrence Malick’s\u0026nbsp;\u003ci\u003eThe Tree of Life\u003c/i\u003e\u003c/li\u003e\u003cli\u003eA 35mm screening of David Lean’s\u0026nbsp;\u003ci\u003eThe Bridge on the River Kwai\u003c/i\u003e\u003c/li\u003e\u003cli\u003eEdgar Wright’s\u0026nbsp;\u003ci\u003eScott Pilgrim vs. the World\u0026nbsp;\u003c/i\u003ein Dolby Atmos\u0026nbsp;\u003cbr\u003e\u0026nbsp;\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003ca href=\"https://netflixstrapicentralcms.blob.core.windows.net/uploads/BL_26_Flyer9_8_9_29_V2_140126ca60.pdf\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003cstrong\u003eClick here for the series schedule.\u003c/strong\u003e\u003c/a\u003e\u0026nbsp;\u003cbr\u003e\u0026nbsp;\u0026nbsp;\u003cbr\u003e\u003cbr\u003eThis year's series has been jam-packed with one-of-a-kind cinematic thrills, including:\u0026nbsp;\u0026nbsp;\u003cbr\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e70mm Highlights\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eThe Big \u0026amp; Loud debuts of 70mm prints of\u0026nbsp;\u003ci\u003e\u003cstrong\u003eWest Side Story\u003c/strong\u003e\u003c/i\u003e\u003cstrong\u003e,\u0026nbsp;\u003c/strong\u003e\u003ci\u003e\u003cstrong\u003eAliens\u003c/strong\u003e\u003c/i\u003e\u003cstrong\u003e,\u0026nbsp;\u003c/strong\u003e\u003ci\u003e\u003cstrong\u003eThe Sound of Music, Batman, Inherent Vice, The Master, Babylon,\u0026nbsp;\u003c/strong\u003e\u003c/i\u003eand\u003ci\u003e\u003cstrong\u003e Kill Bill: The Whole Bloody Affair\u003c/strong\u003e\u003c/i\u003e\u003c/li\u003e\u003cli\u003eThe first ever 70mm screening in New York City of Francis Ford Coppola’s\u0026nbsp;\u003ci\u003e\u003cstrong\u003eOne from the Heart\u0026nbsp;\u003c/strong\u003e\u003c/i\u003e(1981)\u003c/li\u003e\u003cli\u003eThe first NYC 70mm screenings in over 40 years of\u0026nbsp;\u003ci\u003e\u003cstrong\u003eThe Razor’s Edge \u003c/strong\u003e\u003c/i\u003e(1984) starring Bill Murray and\u0026nbsp;\u003ci\u003e\u003cstrong\u003eWhite Nights\u003c/strong\u003e\u003c/i\u003e (1985) starring Mikhail Baryshnikov, Gregory Hines, and Isabella Rossellini.\u003c/li\u003e\u003cli\u003eThe return of The Paris Theater’s own pristine 70mm print of David Lean’s\u0026nbsp;\u003ci\u003e\u003cstrong\u003eLawrence of Arabia\u003c/strong\u003e\u003c/i\u003e, as well as 70mm prints of\u0026nbsp;\u003ci\u003e\u003cstrong\u003e2001: A Space Odyssey\u003c/strong\u003e\u003c/i\u003e,\u0026nbsp;\u003ci\u003e\u003cstrong\u003eVertigo\u003c/strong\u003e\u003c/i\u003e,\u0026nbsp;\u003ci\u003e\u003cstrong\u003eOnce Upon a Time…In Hollywood\u003c/strong\u003e\u003c/i\u003e, \u003ci\u003e\u003cstrong\u003eBoogie Nights\u003c/strong\u003e\u003c/i\u003e and\u0026nbsp;\u003ci\u003e\u003cstrong\u003eSpartacus\u003c/strong\u003e\u003c/i\u003e.\u0026nbsp;\u0026nbsp;\u003cbr\u003e\u0026nbsp;\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003eSpecial guests:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cstrong\u003eSofia Coppola\u003c/strong\u003e will join us for a Q\u0026amp;A following the New York premiere of a new 4K Restoration of\u0026nbsp;\u003ci\u003e\u003cstrong\u003eMarie Antoinette\u003c/strong\u003e\u003c/i\u003e, celebrating its 20th anniversary this year.\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eIsabella Rossellini\u003c/strong\u003e will appear for a Q\u0026amp;A following a rare 70mm screening of\u0026nbsp;\u003ci\u003e\u003cstrong\u003eWhite Nights\u003c/strong\u003e\u003c/i\u003e.\u003c/li\u003e\u003cli\u003eBob Dylan Center director\u0026nbsp;\u003cstrong\u003eSteven Jenkins\u003c/strong\u003e returns to the Paris with\u0026nbsp;\u003ci\u003eStepping Into the Unknown: Films from the Bob Dylan Center\u003c/i\u003e, featuring a new collection of rare and previously unreleased material from the Bob Dylan Archive, followed by a discussion with and live performance by award-winning musician\u0026nbsp;\u003cstrong\u003eBill Frisell\u003c/strong\u003e.\u0026nbsp;\u0026nbsp;\u003cbr\u003e\u0026nbsp;\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003eAdditional highlights:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eThe East Coast premiere of a new 4K restoration of Martin Scorsese's\u0026nbsp;\u003ci\u003e\u003cstrong\u003eNew York, New York,\u0026nbsp;\u003c/strong\u003e\u003c/i\u003eand the New York premiere of a new 4K restoration of\u0026nbsp;\u003ci\u003e\u003cstrong\u003ePanic Room\u003c/strong\u003e\u003c/i\u003e approved by David Fincher.\u003c/li\u003e\u003cli\u003e\u003ci\u003e9 films presented in Dolby Atmos, including the\u0026nbsp;\u003cstrong\u003eLord of the Rings\u003c/strong\u003e trilogy’s original theatrical versions,\u0026nbsp;\u003cstrong\u003eBack to the Future\u003c/strong\u003e,\u0026nbsp;\u003cstrong\u003eBarbie\u003c/strong\u003e,\u0026nbsp;\u003cstrong\u003eBlade Runner: The Final Cut\u003c/strong\u003e,\u0026nbsp;\u003cstrong\u003eMad Max: Fury Road\u003c/strong\u003e, and\u0026nbsp;\u003cstrong\u003eAtomic Blonde\u003c/strong\u003e.\u003c/i\u003e\u003c/li\u003e\u003cli\u003eTo celebrate Star Trek Day on September 8th, we will host a double feature of\u0026nbsp;\u003ci\u003e\u003cstrong\u003eStar Trek: The Motion Picture\u003c/strong\u003e\u003c/i\u003e (The Director's Edition in 4K \u0026amp; Dolby Atmos) and\u0026nbsp;\u003ci\u003e\u003cstrong\u003eStar Trek II: The Wrath of Khan \u003c/strong\u003e\u003c/i\u003e(The Director's Cut).\u003c/li\u003e\u003cli\u003e35mm prints of two films with iconic soundtracks: Lynne Ramsay’s\u0026nbsp;\u003ci\u003e\u003cstrong\u003eMorvern Callar\u0026nbsp;\u003c/strong\u003e\u003c/i\u003estarring Samantha Morton, and Louis Malle’s\u0026nbsp;\u003ci\u003e\u003cstrong\u003eElevator to the Gallows\u003c/strong\u003e\u003c/i\u003e scored by Miles Davis.\u0026nbsp;\u0026nbsp;\u003cbr\u003e\u0026nbsp;\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eThe series originally debuted in 2023 upon the historic Paris Theater's reopening to showcase its newly installed Dolby Atmos sound system and the technology to screen 70mm for the first time in fifteen years. With over 500 seats, Manhattan's last remaining single-screen theater also became its largest Atmos cinema.\u0026nbsp;\u0026nbsp;\u003cbr\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eThis year's edition of \u003cstrong\u003eBig \u0026amp; Loud\u003c/strong\u003e features\u0026nbsp;\u003cstrong\u003e48 films\u003c/strong\u003e, including\u0026nbsp;\u003cstrong\u003e17 films on 70mm\u003c/strong\u003e and\u0026nbsp;\u003cstrong\u003e10 films presented with special Dolby Atmos sound mixes\u003c/strong\u003e.\u0026nbsp;\u003c/p\u003e"])</script><script>self.__next_f.push([1,"39:Tbb6,"])</script><script>self.__next_f.push([1,"\u003cp\u003eOn October 1, Netflix will release Zoe Kazan’s adaptation of John Steinbeck’s masterpiece \u003ci\u003e\u003cstrong\u003eEast of Eden\u003c/strong\u003e\u003c/i\u003e. The seven-episode series features a formidable cast led by Florence Pugh as the indelible antihero Cathy Ames, whose life is intertwined with the lives of generations of men from the Trask family (including Christopher Abbott as Adam and Mike Faist as Charles) as the characters live out the darker side of the California dream. The series arrives over 70 years after the 1955 film adaptation starring James Dean - directed by Elia Kazan, Zoe’s grandfather - focused solely on the book’s final section.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eThat family connection to the material, as well as her own abiding love for the novel, made adapting \u003ci\u003e\u003cstrong\u003eEast of Eden\u003c/strong\u003e\u003c/i\u003e a deeply personal and resonant experience for Zoe Kazan. To celebrate the captivating results of her work, the Paris Theater is proud to present \u003cstrong\u003eThe Monster in All of Us: The Films Behind \u003c/strong\u003e\u003ci\u003e\u003cstrong\u003eEast of Eden\u003c/strong\u003e\u003c/i\u003e, a week-long repertory film series curated in collaboration with Zoe Kazan showcasing films across cinema history that were key inspirations for Kazan throughout her creative process.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eKazan has always been drawn to the character of Cathy Ames – whose enigmatic nature and uncommon sense of agency fascinated her. Many of the films in this series provided inspiration to Kazan as she unfolded more of Cathy’s character out of Steinbeck’s text, including the complex women contained in the performances of Jane Fonda in \u003ci\u003e\u003cstrong\u003eKlute\u003c/strong\u003e\u003c/i\u003e, Barbara Stanwyck in \u003ci\u003e\u003cstrong\u003eStella Dallas\u003c/strong\u003e\u003c/i\u003e, or Scarlett Johansson in \u003ci\u003e\u003cstrong\u003eUnder the Skin\u003c/strong\u003e\u003c/i\u003e. Kazan even found guidance in something Steinbeck once wrote about Cathy in his reflections on writing the novel: “They will forget I said she was bad. And they will hate her because while she is a monster, she is a little piece of the monster in all of us.”\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eThe Monster in All of Us \u003c/strong\u003ewill include a special, free screening of \u003ci\u003e\u003cstrong\u003eEast of Eden\u003c/strong\u003e\u003c/i\u003e episodes 1, 2 \u0026amp; 3 at the Paris Theater, followed by a \u003cstrong\u003eQ\u0026amp;A with Zoe Kazan on Saturday, October 3\u003c/strong\u003e. Later that evening, Kazan will introduce a 35mm presentation of the 1955 film adaptation of \u003ci\u003e\u003cstrong\u003eEast of Eden\u003c/strong\u003e\u003c/i\u003e, directed by Elia Kazan and starring James Dean, Raymond Massey, and Jo Van Fleet in an Academy Award®-winning performance as Cathy.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eZoe Kazan will also give special in-person introductions\u003c/strong\u003e to a 35mm presentation of \u003ci\u003e\u003cstrong\u003eKlute\u003c/strong\u003e\u003c/i\u003e on \u003cstrong\u003eFriday, October 2 at 6:45 PM\u003c/strong\u003e and to Alfred Hitchcock’s \u003ci\u003e\u003cstrong\u003eNotorious\u003c/strong\u003e\u003c/i\u003e on \u003cstrong\u003eSunday, October 4 at 5:45 PM\u003c/strong\u003e.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eSelect screenings will feature pre-recorded introductions from Zoe Kazan, discussing how each film influenced her work on the series.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"3a:Tbb6,"])</script><script>self.__next_f.push([1,"\u003cp\u003eOn October 1, Netflix will release Zoe Kazan’s adaptation of John Steinb
